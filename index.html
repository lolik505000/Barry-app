<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Барри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Firebase (используется только если ниже в коде заполнен FIREBASE_CONFIG) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --curtain: #9E3232;
    --curtain-text: #FFD700;
    --bg: #163420;
    --bg-soft: #1E4429;
    --card: #1B3D26;
    --card-border: #2E5A3B;
    --text: #F4F4F0;
    --text-dim: #C9D6CC;
    --accent: #FFD700;
    --danger: #C24B4B;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{height:100%;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; /* dvh переопределит vh там где поддерживается */
    overflow:hidden;
  }

  /* ===== ШТОРКА (верхняя панель) — всегда сверху, в потоке, не scroll ===== */
  #curtain{
    flex:0 0 auto; z-index:50;
    background:var(--curtain); color:var(--curtain-text);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  #curtain .brand{display:flex; align-items:center; gap:10px;}
  #curtain .logo{width:42px; height:42px; border-radius:10px; background:rgba(255,215,0,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  #curtain .logo svg{width:100%; height:100%;}
  #curtain .titles{display:flex; flex-direction:column; line-height:1.15;}
  #curtain .titles b{font-size:17px; letter-spacing:.5px;}
  #curtain .titles span{font-size:11px; opacity:.85; font-weight:600;}
  #curtain .gear{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--curtain-text); background:transparent; color:var(--curtain-text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  #curtain .gear.on{background:var(--curtain-text); color:var(--curtain);}
  #curtain .curtain-actions{display:flex; gap:8px; align-items:center;}

  /* ===== ПОИСК ===== */
  #searchOverlay{position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:110; display:flex; flex-direction:column;}
  #searchTop{flex:0 0 auto; background:var(--curtain); padding:10px 12px; display:flex; gap:8px; align-items:center;}
  #searchInput{flex:1; border:1.5px solid rgba(255,215,0,.5); background:rgba(0,0,0,.2); color:var(--curtain-text); border-radius:10px; padding:10px 12px; font-size:15px;}
  #searchInput::placeholder{color:rgba(255,215,0,.6);}
  #searchClose{background:transparent; border:none; color:var(--curtain-text); font-size:22px; cursor:pointer; padding:0 6px;}
  #searchResults{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px;}
  .search-hit{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:11px 13px; margin-bottom:9px; cursor:pointer;}
  .search-hit .hit-cat{font-size:10.5px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px;}
  .search-hit .hit-title{font-size:14.5px; font-weight:700;}
  .search-hit .hit-tags{margin-top:5px;}
  .search-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 12px;}

  #tabsRow{
    flex:0 0 auto; z-index:49;
    background:var(--curtain); display:flex; gap:6px; padding:0 10px 8px 10px; overflow-x:auto;
  }
  #tabsRow::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid rgba(255,215,0,.4);
    background:transparent; color:var(--curtain-text); font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .tab-btn.active{background:var(--curtain-text); color:var(--curtain); border-color:var(--curtain-text);}

  /* ===== СКРОЛЛ-ОБЛАСТЬ — единственное, что скроллится ===== */
  #scrollArea{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:28px;
  }

  .hidden{display:none !important;}

  h2.section-title{font-size:19px; margin:2px 0 12px 0; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between;}
  .pillrow{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .pill{padding:6px 12px; border-radius:999px; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer;}
  .pill.active{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .pill.addpill{background:transparent; border:1.5px dashed rgba(255,215,0,.5); color:var(--accent);}
  .pill.sm{padding:5px 10px; font-size:11.5px;}

  .card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;}
  .card h3{margin:0 0 4px 0; font-size:15.5px;}
  .card p{margin:4px 0; font-size:13.5px; color:var(--text-dim); line-height:1.45;}
  .chip{display:inline-block; background:rgba(255,215,0,.14); color:var(--accent); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; margin:2px 4px 2px 0;}
  .card .meta{display:flex; flex-wrap:wrap; margin-top:6px;}
  .card .actions{display:flex; gap:8px; margin-top:10px;}
  .card img.thumb{width:100%; border-radius:10px; margin-top:8px; display:block;}
  .empty{color:var(--text-dim); font-size:13.5px; text-align:center; padding:26px 10px; border:1.5px dashed var(--card-border); border-radius:var(--radius);}

  button.btn{border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer;}
  button.btn-primary{background:var(--accent); color:#2b2200;}
  button.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--card-border);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  button.btn-sm{padding:6px 10px; font-size:12px;}
  button.btn-block{width:100%; margin:10px 0;}
  .fab{position:fixed; right:16px; bottom:80px; z-index:40; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#2b2200; font-size:26px; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:pointer;}

  #bottomNav{flex:0 0 auto; background:var(--bg-soft); border-top:1px solid var(--card-border); display:flex; z-index:45;}
  #bottomNav button{flex:1; background:none; border:none; color:var(--text-dim); padding:9px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  #bottomNav button span.ic{font-size:19px;}
  #bottomNav button.active{color:var(--accent);}

  /* modal */
  #modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  #modal{background:var(--bg-soft); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:18px 18px 0 0; padding:16px 16px 22px;}
  #modal h3{margin:0 0 12px 0;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .field .hint{font-size:11px; color:var(--text-dim); opacity:.75; margin-top:4px;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit;
  }
  .field textarea{min-height:70px; resize:vertical;}
  .chipselect{display:flex; flex-wrap:wrap; gap:7px;}
  .chipselect .opt{padding:6px 11px; border-radius:999px; border:1.5px solid var(--card-border); font-size:12.5px; cursor:pointer; color:var(--text-dim);}
  .chipselect .opt.sel{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; margin-top:14px;}
  .modal-actions button{flex:1;}
  .photo-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .photo-row img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1.5px solid var(--card-border);}
  .photo-row .rm{position:relative;}
  .photo-row .rm button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1;}

  .adminOnly{display:none;}
  body.admin .adminOnly{display:inline-flex;}
  body.admin .adminOnly.block{display:block;}
  body.admin .adminOnly.pill{display:inline-block;}

  .banner{background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.35); color:var(--accent); font-size:12px; padding:8px 12px; border-radius:10px; margin-bottom:12px;}
  .subhead{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:10px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .prod-line{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:9px 11px; margin-bottom:7px;}
  .prod-line .info{flex:1; min-width:0;}
  .prod-line .info b{font-size:13.5px; display:block;}
  .prod-line .info span{font-size:11.5px; color:var(--text-dim);}
  .prod-line input.qty{width:58px; text-align:center; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:8px; padding:6px 4px; font-size:13px; flex-shrink:0;}
  .group-block{margin-bottom:16px;}
  .group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .group-head h3{margin:0; font-size:15px; color:var(--accent);}
  .subgroup-title{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:8px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .tc-group{margin-bottom:12px;}
  .tc-group-head{display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--card-border); border-radius:12px; padding:10px 12px; cursor:pointer;}
  .tc-group-head b{flex:1; font-size:14.5px;}
  .tc-group-head .arrow{transition:transform .18s; font-size:13px; color:var(--accent);}
  .tc-group-head.collapsed .arrow{transform:rotate(-90deg);}
  .tc-group-body{padding-top:10px;}
  .tc-group-body.collapsed{display:none;}
  .tc-group-del{margin-left:4px;}
  #shopResult{white-space:pre-wrap; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-top:12px;}
  #shopStickyWrap{position:sticky; bottom:0; background:var(--bg); padding-top:8px; margin-top:4px;}
</style>
</head>

/* ==================== НАСТРОЙКИ ==================== */

let DATA = {

// собрать все теги+названия по всем разделам в единый плоский список для поиска
function buildSearchIndex(){
  const idx = [];
  DATA.techcards.forEach(tc=> idx.push({
    label: tc.name, tags: tc.tags||[], category: "Тех.карты",
    go: ()=>{ activeTab="techcards"; collapsedGroups[tc.groupId||"__none"]=false; }
  }));
  DATA.customTabs.forEach(t=>{
    (t.categories||[]).forEach(c=>{
      (c.subcategories||[]).forEach(s=>{
        (s.notes||[]).forEach(n=> idx.push({
          label: n.title, tags: n.tags||[], category: `Партнёры → ${t.name} → ${c.name} → ${s.name}`,
          go: ()=>{ activeTab="partners"; activePartnerTabId=t.id; activeCategoryId=c.id; activeSubcategoryId=s.id; }
        }));
      });
    });
  });
  DATA.vodvore.forEach(c=> idx.push({
    label: c.name, tags: c.tags||[], category: "Во дворе",
    go: ()=>{ activeTab="vodvore"; }
  }));
  (DATA.procurement.groups||[]).forEach(g=>{
    (g.subgroups||[]).forEach(sg=>{
      (sg.products||[]).forEach(p=> idx.push({
        label: p.name, tags: p.tags||[], category: `Закупки → ${g.name} → ${sg.name}`,
        go: ()=>{ activeTab="procurement"; }
      }));
    });
  });
  return idx;
}

function runSearch(query){
  const q = query.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = "";
  if(!q){ resultsEl.appendChild(el(`<div class="search-hint">Начни вводить название или тег — ищем сразу везде: тех.карты, партнёры, во дворе, закупки.</div>`)); return; }
  const idx = buildSearchIndex();
  const hits = idx.filter(item=>{
    if(item.label && item.label.toLowerCase().includes(q)) return true;
    return (item.tags||[]).some(t=> t.toLowerCase().includes(q));
  });
  if(!hits.length){ resultsEl.appendChild(el(`<div class="search-hint">Ничего не нашлось.</div>`)); return; }
  hits.forEach(hit=>{
    const tagsHtml = (hit.tags||[]).length? `<div class="hit-tags">${hit.tags.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join("")}</div>` : "";
    const row = el(`
      <div class="search-hit">
        <div class="hit-cat">${escapeHtml(hit.category)}</div>
        <div class="hit-title">${escapeHtml(hit.label)}</div>
        ${tagsHtml}
      </div>`);
    row.addEventListener('click', ()=>{ hit.go(); closeSearch(); render(); });
    resultsEl.appendChild(row);
  });
}

function openSearch(){
  document.getElementById('searchOverlay').classList.remove('hidden');
  const input = document.getElementById('searchInput');
  input.value = "";
  runSearch("");
  setTimeout(()=> input.focus(), 50);
}
function closeSearch(){ document.getElementById('searchOverlay').classList.add('hidden'); }

// теги "через запятую" -> массив
function parseTags(str){
  return (str||"").split(",").map(s=>s.trim()).filter(Boolean);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ==================== ХРАНИЛИЩЕ ==================== */
let storageMode = "local"; // 'firebase' | 'cloud' | 'local'
let db = null;

function firebaseConfigured(){ return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey); }

function initStorage(){
  if(firebaseConfigured() && window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      storageMode = "firebase";
      return;
    }catch(e){ console.error("Firebase init error", e); }
  }
  if(window.storage && window.storage.get){ storageMode = "cloud"; return; }
  storageMode = "local";
}

async function loadSectionRaw(section){
  const key = SECTION_KEYS[section];
  try{
    if(storageMode === "firebase"){
      const snap = await db.collection("barry").doc(section).get();
      return snap.exists ? snap.data().payload : null;
    } else if(storageMode === "cloud"){
      const res = await window.storage.get(key, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
}

async function saveSection(section){
  const key = SECTION_KEYS[section];
  const value = DATA[section];
  try{
    if(storageMode === "firebase"){
      await db.collection("barry").doc(section).set({payload:value});
    } else if(storageMode === "cloud"){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){
    console.error("Ошибка сохранения", e);
    alert("Не удалось сохранить. Возможно, слишком много крупных фото — попробуй уменьшить их количество.");
  }
}

async function loadLegacyBlob(){
  try{
    if(storageMode === "cloud"){
      const res = await window.storage.get(LEGACY_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else if(storageMode === "local"){
      const raw = localStorage.getItem(LEGACY_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
  return null;
}

async function loadAllData(){
  const [tc, tg_, ct, vd, pr] = await Promise.all([
    loadSectionRaw("techcards"), loadSectionRaw("techcardGroups"), loadSectionRaw("customTabs"),
    loadSectionRaw("vodvore"), loadSectionRaw("procurement")
  ]);

  if(tc===null && tg_===null && ct===null && vd===null && pr===null){
    // новых данных ещё нет — пробуем мигрировать со старой версии приложения
    const legacy = await loadLegacyBlob();
    if(legacy){
      DATA.techcards = legacy.techcards || [];
      DATA.vodvore = legacy.vodvore || [];
      DATA.procurement = legacy.procurement || {groups:[]};
      if(Array.isArray(legacy.druzhba) && legacy.druzhba.length){
        const tabs = JSON.parse(JSON.stringify(DEFAULT_CUSTOM_TABS));
        legacy.druzhba.forEach(item=>{
          const cat = tabs[0].categories.find(c=>c.id===item.cat) || tabs[0].categories[0];
          cat.subcategories[0].notes.push({id:item.id||uid(), title:item.title, text:item.text});
        });
        DATA.customTabs = tabs;
      }
      await Promise.all(["techcards","techcardGroups","customTabs","vodvore","procurement"].map(saveSection));
      return;
    }
  }

  if(tc) DATA.techcards = tc;
  if(tg_) DATA.techcardGroups = tg_;
  if(ct) DATA.customTabs = ct;
  if(vd) DATA.vodvore = vd;
  if(pr) DATA.procurement = pr;
}

function subscribeRealtime(){
  if(storageMode !== "firebase") return;
  Object.keys(SECTION_KEYS).forEach(section=>{
    db.collection("barry").doc(section).onSnapshot(snap=>{
      if(snap.exists){ DATA[section] = snap.data().payload; render(); }
    });
  });
}

/* ==================== TELEGRAM / АДМИН ==================== */
let tg = window.Telegram ? window.Telegram.WebApp : null;
let currentUserId = null;

    tg.ready(); tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;

    tg.onEvent && tg.onEvent("viewportChanged", setAppHeight);

function toggleAdmin(){

    const entered = prompt("Не удалось определить Telegram ID автоматически (запусти внутри Telegram).\nДля теста введи свой Telegram ID вручную:");
    if(!entered) return;
    idToCheck = parseInt(entered.trim(), 10);
  }
  if(ADMIN_IDS.includes(idToCheck)){
    isAdmin = true;
    applyAdminState();
  } else {
    alert("Этот Telegram ID не в списке администраторов.");

function applyAdminState(){
  document.body.classList.toggle("admin", isAdmin);
  document.getElementById("adminToggle").classList.toggle("on", isAdmin);

/* ==================== НАВИГАЦИЯ ==================== */
let activeTab = "techcards";
let activePartnerTabId = null;
let activeCategoryId = null;
let activeSubcategoryId = null;
let collapsedGroups = {}; // {groupId: true/false} для тех.карт

document.querySelectorAll("#bottomNav button").forEach(btn=>{
  btn.addEventListener("click", ()=>{ activeTab = btn.dataset.tab; render(); });
});
document.getElementById("adminToggle").addEventListener("click", toggleAdmin);
document.getElementById("fabAdd").addEventListener("click", ()=> openAddModalForTab());

document.getElementById("searchClose").addEventListener("click", closeSearch);

/* ==================== РЕНДЕР ==================== */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }

function render(){
  document.querySelectorAll("#bottomNav button").forEach(b=> b.classList.toggle("active", b.dataset.tab===activeTab));
  document.getElementById("fabAdd").classList.toggle("hidden", !isAdmin || activeTab==="procurement" || activeTab==="partners");
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(activeTab==="techcards") renderTechcards(main);
  if(activeTab==="partners") renderPartners(main);
  if(activeTab==="vodvore") renderVodvore(main);
  if(activeTab==="procurement") renderProcurement(main);

/* ---------- ТЕХ.КАРТЫ (со сворачиваемыми группами) ---------- */
function techcardCardEl(tc){
  const photos = (tc.photos||[]).map(p=>`<img class="thumb" src="${p}">`).join("");
  const tags = (tc.tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join("");
  const card = el(`
    <div class="card">
      <h3>${escapeHtml(tc.name)}</h3>
      <p>${escapeHtml(tc.ingredients||"")}</p>
      ${tc.steps? `<p><b>Приготовление:</b> ${escapeHtml(tc.steps)}</p>`:""}
      ${tags? `<div class="meta">${tags}</div>`:""}
      ${photos}
      <div class="actions adminOnly">
        <button class="btn btn-outline btn-sm" data-edit="${tc.id}">Изменить</button>
        <button class="btn btn-danger btn-sm" data-del="${tc.id}">Удалить</button>
      </div>
    </div>`);
  card.querySelector('[data-edit]')?.addEventListener('click', ()=> openTechcardModal(tc));
  card.querySelector('[data-del]')?.addEventListener('click', ()=> deleteItem('techcards', tc.id));
  return card;
}

function renderTechcards(main){
  main.appendChild(el(`<h2 class="section-title">Тех.карты</h2>`));
  if(storageMode==="local") main.appendChild(el(`<div class="banner">⚠️ Работает без общего хранилища — данные видны только в этом браузере. Смотри инструкцию по Firebase, чтобы данные были общими для всех.</div>`));

  const addGroupBtn = el(`<button class="btn btn-primary btn-sm adminOnly block" style="margin-bottom:12px;">+ Добавить группу (Бургеры, Закуски...)</button>`);
  addGroupBtn.addEventListener('click', openAddTechcardGroupModal);
  main.appendChild(addGroupBtn);

  if(DATA.techcards.length===0 && DATA.techcardGroups.length===0){
    main.appendChild(el(`<div class="empty">Пока нет технологических карт.${isAdmin? ' Нажми «+», чтобы добавить первую.':''}</div>`));
    return;
  }

  DATA.techcardGroups.forEach(g=>{
    const items = DATA.techcards.filter(tc=>tc.groupId===g.id);
    const isCollapsed = !!collapsedGroups[g.id];
    const wrap = el(`<div class="tc-group"></div>`);
    const head = el(`
      <div class="tc-group-head ${isCollapsed?'collapsed':''}">
        <span class="arrow">▼</span>
        <b>${escapeHtml(g.name)} <span style="opacity:.6; font-weight:400;">(${items.length})</span></b>
        <button class="btn btn-danger btn-sm adminOnly tc-group-del" data-delg="${g.id}">Удалить</button>
      </div>`);
    const body = el(`<div class="tc-group-body ${isCollapsed?'collapsed':''}"></div>`);
    items.slice().reverse().forEach(tc=> body.appendChild(techcardCardEl(tc)));
    if(items.length===0) body.appendChild(el(`<div class="empty">Пусто</div>`));
    head.addEventListener('click', (e)=>{
      if(e.target.closest('[data-delg]')) return;
      collapsedGroups[g.id] = !collapsedGroups[g.id];
      render();
    });
    head.querySelector('[data-delg]')?.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm(`Удалить группу «${g.name}»? Карты внутри останутся без группы.`)){
        DATA.techcardGroups = DATA.techcardGroups.filter(x=>x.id!==g.id);
        DATA.techcards.forEach(tc=>{ if(tc.groupId===g.id) tc.groupId=null; });
        Promise.all([saveSection('techcardGroups'), saveSection('techcards')]).then(render);
      }
    });
    wrap.appendChild(head); wrap.appendChild(body);
    main.appendChild(wrap);
  });

  const ungrouped = DATA.techcards.filter(tc=>!tc.groupId || !DATA.techcardGroups.some(g=>g.id===tc.groupId));
  if(ungrouped.length){
    if(DATA.techcardGroups.length) main.appendChild(el(`<div class="subhead">Без группы</div>`));
    ungrouped.slice().reverse().forEach(tc=> main.appendChild(techcardCardEl(tc)));
  }
}

function openAddTechcardGroupModal(){
  const body = `
    <h3>Новая группа тех.карт</h3>
    <div class="field"><label>Название (например: «Бургеры», «Закуски»)</label><input type="text" id="f_name"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Отмена</button>
      <button class="btn btn-primary" id="mSave">Добавить</button>
    </div>`;
  const overlay = openModal(body);
  overlay.querySelector('#mCancel').addEventListener('click', closeModal);
  overlay.querySelector('#mSave').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#f_name').value.trim();
    if(!name) return;
    DATA.techcardGroups.push({id:uid(), name});
    await saveSection('techcardGroups'); closeModal(); render();
  });
}

function openTechcardModal(tc){
  const editing = !!tc;
  tc = tc || {id:uid(), name:"", ingredients:"", steps:"", photos:[], tags:[], groupId:null};
  const groupOptions = `<option value="">Без группы</option>` + DATA.techcardGroups.map(g=>
    `<option value="${g.id}" ${tc.groupId===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join("");
  const body = `
    <h3>${editing? "Изменить тех.карту":"Новая тех.карта"}</h3>
    <div class="field"><label>Название</label><input type="text" id="f_name" value="${attr(tc.name)}"></div>
    <div class="field"><label>Группа</label><select id="f_group">${groupOptions}</select></div>
    <div class="field"><label>Ингредиенты / состав</label><textarea id="f_ing">${escapeHtml(tc.ingredients)}</textarea></div>
    <div class="field"><label>Как готовить</label><textarea id="f_steps">${escapeHtml(tc.steps)}</textarea></div>
    <div class="field"><label>Теги (через запятую)</label><input type="text" id="f_tags" value="${attr((tc.tags||[]).join(', '))}" placeholder="например: острое, свинина, хит">
      <div class="hint">По тегам и названию потом можно найти карту через поиск в шторке.</div>
    </div>
    <div class="field">
      <label>Фото</label>
      <input type="file" id="f_photo" accept="image/*" multiple>
      <div class="hint">Фото автоматически сжимаются перед сохранением, чтобы не раздувать базу — качество для кухни хватит с головой.</div>
      <div class="photo-row" id="f_photoRow"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Отмена</button>
      <button class="btn btn-primary" id="mSave">Сохранить</button>
    </div>`;
  const overlay = openModal(body);
  let photos = (tc.photos||[]).slice();
  renderPhotoRow();
  function renderPhotoRow(){
    const row = overlay.querySelector('#f_photoRow');
    row.innerHTML = "";
    photos.forEach((p,i)=>{
      const w = el(`<div class="rm"><img src="${p}"><button data-i="${i}">×</button></div>`);

// Сжимаем фото сильно: ширина максимум 480px, качество JPEG 0.5.
// Этого достаточно чтобы разглядеть блюдо/подачу, но файл весит в разы меньше.
function resizeImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function collectShoppingList(){
  let out = "";
  DATA.procurement.groups.forEach(g=>{
    let groupLines = [];
    (g.subgroups||[]).forEach(sg=>{
      (sg.products||[]).forEach(p=>{
        const input = document.querySelector(`.qty[data-pid="${p.id}"]`);
        const qty = input ? parseFloat(input.value) : 0;
        if(qty && qty>0){
          groupLines.push(`— ${p.name}: ${qty}${p.unit? " "+p.unit:""}${p.comment? " ("+p.comment+")":""}`);
        }
      });
    });
    if(groupLines.length){
      out += `📦 ${g.name}\n` + groupLines.join("\n") + "\n\n";
    }
  });
  const resultBox = document.getElementById('shopResult');
  if(!out){ resultBox.classList.add('hidden'); alert("Укажи количество хотя бы для одного товара."); return; }
  resultBox.textContent = out.trim();
  resultBox.classList.remove('hidden');
  resultBox.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ==================== ОБЩИЕ ХЕЛПЕРЫ ==================== */
function upsert(section, item){
  const arr = DATA[section];
  const idx = arr.findIndex(x=>x.id===item.id);
  if(idx>=0) arr[idx]=item; else arr.push(item);
}
async function deleteItem(section, id){
  if(!confirm("Удалить запись?")) return;
  DATA[section] = DATA[section].filter(x=>x.id!==id);
  await saveSection(section); render();
}

function openModal(innerHtml){
  const overlay = el(`<div id="modalOverlay"><div id="modal">${innerHtml}</div></div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.body.appendChild(overlay);

<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Барри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --curtain: #9E3232;
    --curtain-text: #FFD700;
    --bg: #163420;
    --bg-soft: #1E4429;
    --card: #1B3D26;
    --card-border: #2E5A3B;
    --text: #F4F4F0;
    --text-dim: #C9D6CC;
    --accent: #FFD700;
    --danger: #C24B4B;
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{height:100%;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; /* dvh переопределит vh там где поддерживается */
    overflow:hidden;
  }

  /* ===== ШТОРКА (верхняя панель) — всегда сверху, в потоке, не scroll ===== */
  #curtain{
    flex:0 0 auto; z-index:50;
    background:var(--curtain); color:var(--curtain-text);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  #curtain .brand{display:flex; align-items:center; gap:10px;}
  #curtain .logo{width:42px; height:42px; border-radius:10px; background:rgba(255,215,0,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  #curtain .logo svg{width:100%; height:100%;}
  #curtain .titles{display:flex; flex-direction:column; line-height:1.15;}
  #curtain .titles b{font-size:17px; letter-spacing:.5px;}
  #curtain .titles span{font-size:11px; opacity:.85; font-weight:600;}
  #curtain .gear{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--curtain-text); background:transparent; color:var(--curtain-text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  #curtain .gear.on{background:var(--curtain-text); color:var(--curtain);}

  #tabsRow{
    flex:0 0 auto; z-index:49;
    background:var(--curtain); display:flex; gap:6px; padding:0 10px 8px 10px; overflow-x:auto;
  }
  #tabsRow::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid rgba(255,215,0,.4);
    background:transparent; color:var(--curtain-text); font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .tab-btn.active{background:var(--curtain-text); color:var(--curtain); border-color:var(--curtain-text);}

  /* ===== СКРОЛЛ-ОБЛАСТЬ — единственное, что скроллится ===== */
  #scrollArea{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:28px;
  }

  .hidden{display:none !important;}

  h2.section-title{font-size:19px; margin:2px 0 12px 0; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between;}
  .pillrow{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .pill{padding:6px 12px; border-radius:999px; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer;}
  .pill.active{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .pill.addpill{background:transparent; border:1.5px dashed rgba(255,215,0,.5); color:var(--accent);}
  .pill.sm{padding:5px 10px; font-size:11.5px;}

  .card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;}
  .card h3{margin:0 0 4px 0; font-size:15.5px;}
  .card p{margin:4px 0; font-size:13.5px; color:var(--text-dim); line-height:1.45;}
  .chip{display:inline-block; background:rgba(255,215,0,.14); color:var(--accent); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; margin:2px 4px 2px 0;}
  .card .meta{display:flex; flex-wrap:wrap; margin-top:6px;}
  .card .actions{display:flex; gap:8px; margin-top:10px;}
  .card img.thumb{width:100%; border-radius:10px; margin-top:8px; display:block;}
  .empty{color:var(--text-dim); font-size:13.5px; text-align:center; padding:26px 10px; border:1.5px dashed var(--card-border); border-radius:var(--radius);}

  button.btn{border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer;}
  button.btn-primary{background:var(--accent); color:#2b2200;}
  button.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--card-border);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  button.btn-sm{padding:6px 10px; font-size:12px;}
  button.btn-block{width:100%; margin:10px 0;}
  .fab{position:fixed; right:16px; bottom:80px; z-index:40; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#2b2200; font-size:26px; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:pointer;}

  #bottomNav{flex:0 0 auto; background:var(--bg-soft); border-top:1px solid var(--card-border); display:flex; z-index:45;}
  #bottomNav button{flex:1; background:none; border:none; color:var(--text-dim); padding:9px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  #bottomNav button span.ic{font-size:19px;}
  #bottomNav button.active{color:var(--accent);}

  /* modal */
  #modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  #modal{background:var(--bg-soft); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:18px 18px 0 0; padding:16px 16px 22px;}
  #modal h3{margin:0 0 12px 0;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .field .hint{font-size:11px; color:var(--text-dim); opacity:.75; margin-top:4px;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit;
  }
  .field textarea{min-height:70px; resize:vertical;}
  .chipselect{display:flex; flex-wrap:wrap; gap:7px;}
  .chipselect .opt{padding:6px 11px; border-radius:999px; border:1.5px solid var(--card-border); font-size:12.5px; cursor:pointer; color:var(--text-dim);}
  .chipselect .opt.sel{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; margin-top:14px;}
  .modal-actions button{flex:1;}
  .photo-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .photo-row img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1.5px solid var(--card-border);}
  .photo-row .rm{position:relative;}
  .photo-row .rm button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1;}

  .adminOnly{display:none;}
  body.admin .adminOnly{display:inline-flex;}
  body.admin .adminOnly.block{display:block;}
  body.admin .adminOnly.pill{display:inline-block;}

  .banner{background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.35); color:var(--accent); font-size:12px; padding:8px 12px; border-radius:10px; margin-bottom:12px;}
  .subhead{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:10px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .prod-line{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:9px 11px; margin-bottom:7px;}
  .prod-line .info{flex:1; min-width:0;}
  .prod-line .info b{font-size:13.5px; display:block;}
  .prod-line .info span{font-size:11.5px; color:var(--text-dim);}
  .prod-line input.qty{width:58px; text-align:center; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:8px; padding:6px 4px; font-size:13px; flex-shrink:0;}
  .group-block{margin-bottom:16px;}
  .group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .group-head h3{margin:0; font-size:15px; color:var(--accent);}
  .subgroup-title{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:8px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}
  #shopResult{white-space:pre-wrap; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-top:12px;}
  #shopStickyWrap{position:sticky; bottom:0; background:var(--bg); padding-top:8px; margin-top:4px;}
</style>
</head>

/* ==================== НАСТРОЙКИ ==================== */

const FIREBASE_CONFIG = {

const SECTION_KEYS = {

const DEFAULT_CUSTOM_TABS = [

/* ==================== ДАННЫЕ ==================== */
let DATA = {

};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ==================== ХРАНИЛИЩЕ ==================== */
let storageMode = "local"; // 'firebase' | 'cloud' | 'local'
let db = null;

function firebaseConfigured(){ return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey); }

function initStorage(){
  if(firebaseConfigured() && window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      storageMode = "firebase";
      return;
    }catch(e){ console.error("Firebase init error", e); }
  }
  if(window.storage && window.storage.get){ storageMode = "cloud"; return; }
  storageMode = "local";
}

async function loadSectionRaw(section){
  const key = SECTION_KEYS[section];
  try{
    if(storageMode === "firebase"){
      const snap = await db.collection("barry").doc(section).get();
      return snap.exists ? snap.data().payload : null;
    } else if(storageMode === "cloud"){
      const res = await window.storage.get(key, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
}

async function saveSection(section){
  const key = SECTION_KEYS[section];
  const value = DATA[section];
  try{
    if(storageMode === "firebase"){
      await db.collection("barry").doc(section).set({payload:value});
    } else if(storageMode === "cloud"){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){
    console.error("Ошибка сохранения", e);
    alert("Не удалось сохранить. Возможно, слишком много крупных фото — попробуй уменьшить их количество.");
  }
}

async function loadLegacyBlob(){
  try{
    if(storageMode === "cloud"){
      const res = await window.storage.get(LEGACY_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else if(storageMode === "local"){
      const raw = localStorage.getItem(LEGACY_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
  return null;
}

async function loadAllData(){
  const [tc, ct, vd, pr] = await Promise.all([
    loadSectionRaw("techcards"), loadSectionRaw("customTabs"),
    loadSectionRaw("vodvore"), loadSectionRaw("procurement")
  ]);

  if(tc===null && ct===null && vd===null && pr===null){
    // новых данных ещё нет — пробуем мигрировать со старой версии приложения
    const legacy = await loadLegacyBlob();
    if(legacy){
      DATA.techcards = legacy.techcards || [];
      DATA.vodvore = legacy.vodvore || [];
      DATA.procurement = legacy.procurement || {groups:[]};
      if(Array.isArray(legacy.druzhba) && legacy.druzhba.length){
        const tabs = JSON.parse(JSON.stringify(DEFAULT_CUSTOM_TABS));
        legacy.druzhba.forEach(item=>{
          const cat = tabs[0].categories.find(c=>c.id===item.cat) || tabs[0].categories[0];
          cat.subcategories[0].notes.push({id:item.id||uid(), title:item.title, text:item.text});
        });
        DATA.customTabs = tabs;
      }
      await Promise.all(["techcards","customTabs","vodvore","procurement"].map(saveSection));
      return;
    }
  }

  if(tc) DATA.techcards = tc;
  if(ct) DATA.customTabs = ct;
  if(vd) DATA.vodvore = vd;
  if(pr) DATA.procurement = pr;
}

function subscribeRealtime(){
  if(storageMode !== "firebase") return;
  Object.keys(SECTION_KEYS).forEach(section=>{
    db.collection("barry").doc(section).onSnapshot(snap=>{
      if(snap.exists){ DATA[section] = snap.data().payload; render(); }
    });
  });
}

/* ==================== НАВИГАЦИЯ ==================== */
let activeTab = "techcards";
let activePartnerTabId = null;

document.querySelectorAll("#bottomNav button").forEach(btn=>{

function render(){

function openTechcardModal(tc){
  const editing = !!tc;
  tc = tc || {id:uid(), name:"", ingredients:"", steps:"", photos:[]};
  const body = `
    <h3>${editing? "Изменить тех.карту":"Новая тех.карта"}</h3>
    <div class="field"><label>Название</label><input type="text" id="f_name" value="${attr(tc.name)}"></div>
    <div class="field"><label>Ингредиенты / состав</label><textarea id="f_ing">${escapeHtml(tc.ingredients)}</textarea></div>
    <div class="field"><label>Как готовить</label><textarea id="f_steps">${escapeHtml(tc.steps)}</textarea></div>
    <div class="field">

      <input type="file" id="f_photo" accept="image/*" multiple>
      <div class="hint">Фото автоматически сжимаются перед сохранением, чтобы не раздувать базу — качество для кухни хватит с головой.</div>
      <div class="photo-row" id="f_photoRow"></div>
    </div>

      <button class="btn btn-outline" id="mCancel">Отмена</button>

    </div>`;
  const overlay = openModal(body);
  let photos = (tc.photos||[]).slice();
  renderPhotoRow();
  function renderPhotoRow(){
    const row = overlay.querySelector('#f_photoRow');
    row.innerHTML = "";
    photos.forEach((p,i)=>{
      const w = el(`<div class="rm"><img src="${p}"><button data-i="${i}">×</button></div>`);
      w.querySelector('button').addEventListener('click', ()=>{ photos.splice(i,1); renderPhotoRow(); });
      row.appendChild(w);
    });
  }
  overlay.querySelector('#f_photo').addEventListener('change', async (e)=>{
    for(const file of e.target.files){
      const dataUrl = await resizeImage(file);
      photos.push(dataUrl);
    }
    renderPhotoRow();
  });
  overlay.querySelector('#mCancel').addEventListener('click', closeModal);
  overlay.querySelector('#mSave').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#f_name').value.trim();
    if(!name){ alert("Укажи название"); return; }
    tc.name = name;
    tc.ingredients = overlay.querySelector('#f_ing').value.trim();
    tc.steps = overlay.querySelector('#f_steps').value.trim();

    upsert('techcards', tc);
    await saveSection('techcards');
    closeModal(); render();
  });
}

// Сжимаем фото сильно: ширина максимум 480px, качество JPEG 0.5.
// Этого достаточно чтобы разглядеть блюдо/подачу, но файл весит в разы меньше.
function resizeImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- ПАРТНЁРЫ (гибкие вкладки → категории → подкатегории → записи) ---------- */
function renderPartners(main){
  main.appendChild(el(`<h2 class="section-title">Партнёры</h2>`));

  // строка вкладок
  const tabRow = el(`<div class="pillrow"></div>`);
  DATA.customTabs.forEach(t=>{
    if(!activePartnerTabId) activePartnerTabId = t.id;
    const p = el(`<div class="pill ${t.id===activePartnerTabId?'active':''}">${escapeHtml(t.name)}</div>`);
    p.addEventListener('click', ()=>{ activePartnerTabId=t.id; activeCategoryId=null; activeSubcategoryId=null; render(); });
    tabRow.appendChild(p);
  });
  const addTabPill = el(`<div class="pill addpill adminOnly">+ вкладка</div>`);
  addTabPill.addEventListener('click', openAddPartnerTabModal);
  tabRow.appendChild(addTabPill);
  main.appendChild(tabRow);

  if(DATA.customTabs.length===0){
    main.appendChild(el(`<div class="empty">Пока нет вкладок партнёров.${isAdmin?' Нажми «+ вкладка».':''}</div>`));
    return;
  }

  const tab = DATA.customTabs.find(t=>t.id===activePartnerTabId) || DATA.customTabs[0];
  activePartnerTabId = tab.id;
  const delTabBtn = el(`<button class="btn btn-danger btn-sm adminOnly" style="margin-bottom:10px;">Удалить вкладку «${escapeHtml(tab.name)}»</button>`);
  delTabBtn.addEventListener('click', ()=>{
    if(confirm(`Удалить вкладку «${tab.name}» со всем содержимым?`)){
      DATA.customTabs = DATA.customTabs.filter(t=>t.id!==tab.id);
      activePartnerTabId = null;
      saveSection('customTabs'); render();
    }
  });
  main.appendChild(delTabBtn);

  // строка категорий
  const catRow = el(`<div class="pillrow"></div>`);
  (tab.categories||[]).forEach(c=>{
    if(!activeCategoryId) activeCategoryId = c.id;
    const p = el(`<div class="pill sm ${c.id===activeCategoryId?'active':''}">${escapeHtml(c.name)}</div>`);
    p.addEventListener('click', ()=>{ activeCategoryId=c.id; activeSubcategoryId=null; render(); });
    catRow.appendChild(p);
  });
  const addCatPill = el(`<div class="pill sm addpill adminOnly">+ категория</div>`);
  addCatPill.addEventListener('click', ()=> openAddCategoryModal(tab));
  catRow.appendChild(addCatPill);
  main.appendChild(catRow);

  if(!(tab.categories||[]).length){
    main.appendChild(el(`<div class="empty">В этой вкладке пока нет категорий.${isAdmin?' Нажми «+ категория».':''}</div>`));
    return;
  }
  const cat = tab.categories.find(c=>c.id===activeCategoryId) || tab.categories[0];
  activeCategoryId = cat.id;
  const delCatBtn = el(`<button class="btn btn-danger btn-sm adminOnly" style="margin-bottom:10px;">Удалить категорию «${escapeHtml(cat.name)}»</button>`);
  delCatBtn.addEventListener('click', ()=>{
    if(confirm(`Удалить категорию «${cat.name}»?`)){
      tab.categories = tab.categories.filter(c=>c.id!==cat.id);
      activeCategoryId = null;
      saveSection('customTabs'); render();
    }
  });
  main.appendChild(delCatBtn);

  // строка подкатегорий
  const subRow = el(`<div class="pillrow"></div>`);
  (cat.subcategories||[]).forEach(s=>{
    if(!activeSubcategoryId) activeSubcategoryId = s.id;
    const p = el(`<div class="pill sm ${s.id===activeSubcategoryId?'active':''}">${escapeHtml(s.name)}</div>`);
    p.addEventListener('click', ()=>{ activeSubcategoryId=s.id; render(); });
    subRow.appendChild(p);
  });
  const addSubPill = el(`<div class="pill sm addpill adminOnly">+ подкатегория</div>`);
  addSubPill.addEventListener('click', ()=> openAddSubcategoryModal(cat));
  subRow.appendChild(addSubPill);
  main.appendChild(subRow);

  if(!(cat.subcategories||[]).length){
    main.appendChild(el(`<div class="empty">Нет подкатегорий.${isAdmin?' Нажми «+ подкатегория».':''}</div>`));
    return;
  }
  const sub = cat.subcategories.find(s=>s.id===activeSubcategoryId) || cat.subcategories[0];
  activeSubcategoryId = sub.id;

  const addNoteBtn = el(`<button class="btn btn-primary btn-sm adminOnly" style="margin-bottom:10px;">+ Запись в «${escapeHtml(sub.name)}»</button>`);
  addNoteBtn.addEventListener('click', ()=> openNoteModal(sub));
  main.appendChild(addNoteBtn);

  if(!(sub.notes||[]).length){
    main.appendChild(el(`<div class="empty">Пока пусто.</div>`));
    return;
  }
  sub.notes.slice().reverse().forEach(n=>{
    const card = el(`
      <div class="card">
        <h3>${escapeHtml(n.title)}</h3>
        <p>${escapeHtml(n.text)}</p>
        <div class="actions adminOnly">
          <button class="btn btn-outline btn-sm" data-edit="${n.id}">Изменить</button>
          <button class="btn btn-danger btn-sm" data-del="${n.id}">Удалить</button>
        </div>
      </div>`);
    card.querySelector('[data-edit]')?.addEventListener('click', ()=> openNoteModal(sub, n));
    card.querySelector('[data-del]')?.addEventListener('click', async ()=>{
      if(!confirm("Удалить запись?")) return;
      sub.notes = sub.notes.filter(x=>x.id!==n.id);
      await saveSection('customTabs'); render();
    });
    main.appendChild(card);
  });
}

/* ---------- ВО ДВОРЕ ---------- */
function renderVodvore(main){
  main.appendChild(el(`<h2 class="section-title">Во дворе — коктейли</h2>`));
  if(DATA.vodvore.length===0){ main.appendChild(el(`<div class="empty">Пока нет коктейлей.</div>`)); return; }
  DATA.vodvore.slice().reverse().forEach(c=>{
    const tastes = (c.tastes||[]).map(t=>`<span class="chip">${t}</span>`).join("");
    const card = el(`
      <div class="card">
        <h3>${escapeHtml(c.name)}</h3>
        <div class="meta">${tastes}</div>
        ${c.composition? `<p><b>Состав:</b> ${escapeHtml(c.composition)}</p>`:""}
        ${c.text? `<p>${escapeHtml(c.text)}</p>`:""}
        <div class="actions adminOnly">
          <button class="btn btn-outline btn-sm" data-edit="${c.id}">Изменить</button>
          <button class="btn btn-danger btn-sm" data-del="${c.id}">Удалить</button>
        </div>
      </div>`);
    card.querySelector('[data-edit]')?.addEventListener('click', ()=> openVodvoreModal(c));
    card.querySelector('[data-del]')?.addEventListener('click', ()=> deleteItem('vodvore', c.id));
    main.appendChild(card);
  });
}

function openVodvoreModal(c){
  const editing = !!c;
  c = c || {id:uid(), name:"", tastes:[], composition:"", text:""};
  const body = `
    <h3>${editing?"Изменить коктейль":"Новый коктейль"}</h3>
    <div class="field"><label>Название</label><input type="text" id="f_name" value="${attr(c.name)}"></div>
    <div class="field"><label>Вкусовые свойства</label>
      <div class="chipselect" id="f_tastes">
        ${TASTE_TAGS.map(t=>`<div class="opt ${c.tastes.includes(t)?'sel':''}" data-v="${t}">${t}</div>`).join("")}
      </div>
    </div>
    <div class="field"><label>Состав</label><textarea id="f_comp">${escapeHtml(c.composition)}</textarea></div>
    <div class="field"><label>Заметки</label><textarea id="f_text">${escapeHtml(c.text)}</textarea></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Отмена</button>
      <button class="btn btn-primary" id="mSave">Сохранить</button>
    </div>`;
  const overlay = openModal(body);
  let tastes = new Set(c.tastes);
  overlay.querySelectorAll('#f_tastes .opt').forEach(o=> o.addEventListener('click', ()=>{
    const v = o.dataset.v;
    if(tastes.has(v)){ tastes.delete(v); o.classList.remove('sel'); } else { tastes.add(v); o.classList.add('sel'); }
  }));
  overlay.querySelector('#mCancel').addEventListener('click', closeModal);
  overlay.querySelector('#mSave').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#f_name').value.trim();
    if(!name){ alert("Укажи название"); return; }
    c.name = name; c.tastes = Array.from(tastes);
    c.composition = overlay.querySelector('#f_comp').value.trim();
    c.text = overlay.querySelector('#f_text').value.trim();
    upsert('vodvore', c);
    await saveSection('vodvore'); closeModal(); render();
  });
}

/* ---------- ЗАКУПКИ ---------- */
function renderProcurement(main){
  main.appendChild(el(`<h2 class="section-title">Закупки</h2>`));
  const addGroupBtn = el(`<button class="btn btn-primary btn-sm adminOnly block" style="margin-bottom:12px;">+ Добавить группу поставщика</button>`);
  addGroupBtn.addEventListener('click', openAddGroupModal);
  main.appendChild(addGroupBtn);

  if(DATA.procurement.groups.length===0){
    main.appendChild(el(`<div class="empty">Пока нет групп закупок.</div>`));
    return;
  }

  DATA.procurement.groups.forEach(g=>{
    const gb = el(`<div class="group-block"></div>`);
    const head = el(`
      <div class="group-head">
        <h3>${escapeHtml(g.name)}</h3>
        <div class="adminOnly" style="display:flex; gap:6px;">
          <button class="btn btn-outline btn-sm" data-sub="${g.id}">+ Подгруппа</button>
          <button class="btn btn-danger btn-sm" data-delg="${g.id}">Удалить</button>
        </div>
      </div>`);
    head.querySelector('[data-sub]')?.addEventListener('click', ()=> openAddSubgroupModal(g));
    head.querySelector('[data-delg]')?.addEventListener('click', ()=>{
      if(confirm(`Удалить группу «${g.name}» со всем содержимым?`)){
        DATA.procurement.groups = DATA.procurement.groups.filter(x=>x.id!==g.id);
        saveSection('procurement'); render();
      }
    });
    gb.appendChild(head);

    (g.subgroups||[]).forEach(sg=>{
      const sgTitle = el(`<div class="subgroup-title">${escapeHtml(sg.name)}</div>`);
      gb.appendChild(sgTitle);
      const addProdBtn = el(`<button class="btn btn-outline btn-sm adminOnly" style="margin-bottom:8px;">+ Товар в «${escapeHtml(sg.name)}»</button>`);
      addProdBtn.addEventListener('click', ()=> openAddProductModal(g, sg));
      gb.appendChild(addProdBtn);
      if((sg.products||[]).length===0){
        gb.appendChild(el(`<div class="empty" style="padding:14px;">Нет товаров</div>`));
      }
      (sg.products||[]).forEach(p=>{
        const line = el(`
          <div class="prod-line">
            <div class="info"><b>${escapeHtml(p.name)}</b><span>${escapeHtml(p.unit||"")}${p.comment? " · "+escapeHtml(p.comment):""}</span></div>
            <input type="number" min="0" class="qty" data-pid="${p.id}" placeholder="0">
            <button class="btn btn-danger btn-sm adminOnly" data-delp="${p.id}">×</button>
          </div>`);
        line.querySelector('[data-delp]')?.addEventListener('click', ()=>{
          sg.products = sg.products.filter(x=>x.id!==p.id);
          saveSection('procurement'); render();
        });
        gb.appendChild(line);
      });
    });
    main.appendChild(gb);
  });

  const stickyWrap = el(`<div id="shopStickyWrap"></div>`);
  const collectBtn = el(`<button class="btn btn-primary btn-block">Собрать список закупок</button>`);
  collectBtn.addEventListener('click', collectShoppingList);
  stickyWrap.appendChild(collectBtn);
  stickyWrap.appendChild(el(`<div id="shopResult" class="hidden"></div>`));
  main.appendChild(stickyWrap);
}

    <div class="modal-actions">

    </div>`;

    const name = overlay.querySelector('#f_name').value.trim();
    if(!name) return;
    sg.products = sg.products || [];
    sg.products.push({id:uid(), name, unit:overlay.querySelector('#f_unit').value.trim(), comment:overlay.querySelector('#f_comment').value.trim()});
    await saveSection('procurement'); closeModal(); render();

function collectShoppingList(){
  let out = "";
  DATA.procurement.groups.forEach(g=>{
    let groupLines = [];
    (g.subgroups||[]).forEach(sg=>{
      (sg.products||[]).forEach(p=>{
        const input = document.querySelector(`.qty[data-pid="${p.id}"]`);
        const qty = input ? parseFloat(input.value) : 0;
        if(qty && qty>0){
          groupLines.push(`— ${p.name}: ${qty}${p.unit? " "+p.unit:""}${p.comment? " ("+p.comment+")":""}`);
        }
      });
    });
    if(groupLines.length){
      out += `📦 ${g.name}\n` + groupLines.join("\n") + "\n\n";
    }
  });
  const resultBox = document.getElementById('shopResult');
  if(!out){ resultBox.classList.add('hidden'); alert("Укажи количество хотя бы для одного товара."); return; }
  resultBox.textContent = out.trim();
  resultBox.classList.remove('hidden');
  resultBox.scrollIntoView({behavior:'smooth', block:'nearest'});
}

/* ==================== ОБЩИЕ ХЕЛПЕРЫ ==================== */
function upsert(section, item){
  const arr = DATA[section];
  const idx = arr.findIndex(x=>x.id===item.id);
  if(idx>=0) arr[idx]=item; else arr.push(item);
}
async function deleteItem(section, id){
  if(!confirm("Удалить запись?")) return;
  DATA[section] = DATA[section].filter(x=>x.id!==id);
  await saveSection(section); render();
}
function openAddModalForTab(){
  if(activeTab==="techcards") openTechcardModal(null);
  if(activeTab==="vodvore") openVodvoreModal(null);
}
function openModal(innerHtml){
  const overlay = el(`<div id="modalOverlay"><div id="modal">${innerHtml}</div></div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ document.getElementById('modalOverlay')?.remove(); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function attr(s){ return escapeHtml(s); }

(async function start(){
  initTelegram();
  initStorage();
  await loadAllData();
  subscribeRealtime();
  render();
})();
