<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Барри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--curtain: #9E3232;
--curtain-text: #FFD700;
--bg: #163420;
--bg-soft: #1E4429;
--card: #1B3D26;
--card-border: #2E5A3B;
--text: #F4F4F0;
--text-dim: #C9D6CC;
--accent: #FFD700;
--danger: #C24B4B;
--radius: 14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0; padding:0; height:100%; background:var(--bg); color:var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;}
body{padding-top:96px; padding-bottom:78px; min-height:100vh; overflow-y:auto;}
/* ===== ШТОРКА (верхняя панель) ===== */
#curtain{
position:fixed; top:0; left:0; right:0; z-index:50;
background:var(--curtain); color:var(--curtain-text);
padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#curtain .brand{display:flex; align-items:center; gap:10px;}
#curtain .logo{width:42px; height:42px; border-radius:10px; background:rgba(255,215,0,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
#curtain .logo svg{width:100%; height:100%;}
#curtain .titles{display:flex; flex-direction:column; line-height:1.15;}
#curtain .titles b{font-size:17px; letter-spacing:.5px;}
#curtain .titles span{font-size:11px; opacity:.85; font-weight:600;}
#curtain .gear{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--curtain-text); background:transparent; color:var(--curtain-text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
#curtain .gear.on{background:var(--curtain-text); color:var(--curtain);}
#tabsRow{
position:fixed; top:62px; left:0; right:0; z-index:49;
background:var(--curtain); display:flex; gap:6px; padding:0 10px 8px 10px; overflow-x:auto;
}
#tabsRow::-webkit-scrollbar{display:none;}
.tab-btn{
flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid rgba(255,215,0,.4);
background:transparent; color:var(--curtain-text); font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer;
position:relative;
}
.tab-btn.active{background:var(--curtain-text); color:var(--curtain); border-color:var(--curtain-text);}
.tab-btn .tab-del{
position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%;
background:var(--danger); color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;
display:none;
}
body.admin .tab-btn .tab-del{display:block;}
main{padding:14px; padding-bottom:100px;}
.hidden{display:none !important;}
h2.section-title{font-size:19px; margin:2px 0 12px 0; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between;}
.subtabs{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; align-items:center;}
.subtab{padding:6px 12px; border-radius:999px; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; position:relative;}
.subtab.active{background:var(--accent); color:#2b2200; border-color:var(--accent);}
.subtab .sub-del{
position:absolute; top:-5px; right:-5px; width:16px; height:16px; border-radius:50%;
background:var(--danger); color:#fff; border:none; font-size:10px; line-height:1; cursor:pointer;
display:none;
}
body.admin .subtab .sub-del{display:block;}
.subtab-add{
padding:6px 10px; border-radius:999px; background:transparent; border:1.5px dashed var(--accent);
color:var(--accent); font-size:14px; font-weight:700; cursor:pointer;
}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;}
.card h3{margin:0 0 4px 0; font-size:15.5px;}
.card p{margin:4px 0; font-size:13.5px; color:var(--text-dim); line-height:1.45;}
.chip{display:inline-block; background:rgba(255,215,0,.14); color:var(--accent); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; margin:2px 4px 2px 0;}
.card .meta{display:flex; flex-wrap:wrap; margin-top:6px;}
.card .actions{display:flex; gap:8px; margin-top:10px;}
/* Фото в тех.картах — компактная сетка */
.photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr)); gap:8px; margin-top:10px;}
.photo-grid img{width:100%; height:80px; object-fit:cover; border-radius:8px; border:1.5px solid var(--card-border);}
.empty{color:var(--text-dim); font-size:13.5px; text-align:center; padding:30px 10px; border:1.5px dashed var(--card-border); border-radius:var(--radius);}
button.btn{border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer;}
button.btn-primary{background:var(--accent); color:#2b2200;}
button.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--card-border);}
button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
button.btn-sm{padding:6px 10px; font-size:12px;}
.fab{position:fixed; right:16px; bottom:92px; z-index:40; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#2b2200; font-size:26px; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:pointer;}
#bottomNav{position:fixed; bottom:0; left:0; right:0; background:var(--bg-soft); border-top:1px solid var(--card-border); display:flex; z-index:45;}
#bottomNav button{flex:1; background:none; border:none; color:var(--text-dim); padding:9px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
#bottomNav button span.ic{font-size:19px;}
#bottomNav button.active{color:var(--accent);}
/* modal */
#modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
#modal{background:var(--bg-soft); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:16px 16px 22px;}
#modal h3{margin:0 0 12px 0;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
.field input[type=text], .field input[type=number], .field textarea, .field select{
width:100%; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit;
}
.field textarea{min-height:70px; resize:vertical;}
.chipselect{display:flex; flex-wrap:wrap; gap:7px;}
.chipselect .opt{padding:6px 11px; border-radius:999px; border:1.5px solid var(--card-border); font-size:12.5px; cursor:pointer; color:var(--text-dim);}
.chipselect .opt.sel{background:var(--accent); color:#2b2200; border-color:var(--accent);}
.modal-actions{display:flex; gap:10px; margin-top:14px;}
.modal-actions button{flex:1;}
.photo-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.photo-row img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1.5px solid var(--card-border);}
.photo-row .rm{position:relative;}
.photo-row .rm button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1;}
.adminOnly{display:none;}
body.admin .adminOnly{display:inline-flex;}
body.admin .adminOnly.block{display:block;}
.banner{background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.35); color:var(--accent); font-size:12px; padding:8px 12px; border-radius:10px; margin-bottom:12px;}
.prod-line{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:9px 11px; margin-bottom:7px;}
.prod-line .info{flex:1;}
.prod-line .info b{font-size:13.5px; display:block;}
.prod-line .info span{font-size:11.5px; color:var(--text-dim);}
.prod-line input.qty{width:58px; text-align:center; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:8px; padding:6px 4px; font-size:13px;}
.group-block{margin-bottom:16px;}
.group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
.group-head h3{margin:0; font-size:15px; color:var(--accent);}
.subgroup-title{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:8px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}
#shopResult{white-space:pre-wrap; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-top:12px;}
/* Фиксированная кнопка "Собрать заказ" */
.fixed-collect-btn{
position:fixed; bottom:78px; left:14px; right:14px; z-index:40;
background:var(--accent); color:#2b2200; border:none; border-radius:12px;
padding:12px; font-weight:700; font-size:14px; cursor:pointer;
box-shadow:0 4px 12px rgba(0,0,0,.4);
}
</style>
</head>

<div class="titles">
<b>БАРРИ</b>
<span id="modeLabel">гость</span>
</div>
</div>
<button class="gear" id="adminToggle" title="Админ-режим">⚙</button>
</div>
<div id="tabsRow"></div>
<main id="main"></main>
<button class="fab hidden adminOnly" id="fabAdd">+</button>
<div id="bottomNav"></div>
<script>
/* ==================== НАСТРОЙКИ ==================== */
const ADMIN_IDS = [1066237617];
const TASTE_TAGS = ["сладкий","кислый","горький","освежающий","крепкий","фруктовый","пряный","сливочный"];
const STORAGE_KEY = "barry-shared-data";
const DEFAULT_DATA = {
tabs: [
{id:"techcards", label:"Тех.карты", icon:"📋"},
{id:"druzhba", label:"Дружба", icon:"🤝"},
{id:"vodvore", label:"Во дворе", icon:"🍹"},
{id:"procurement", label:"Закупки", icon:"🛒"}
],
techcards: [],
druzhba: {
categories: [
{id:"food", label:"Еда", subcats:[{id:"all", label:"Все"}]},
{id:"wine", label:"Вино", subcats:[{id:"all", label:"Все"}]}
],
items: []
},
vodvore: [],
procurement: { groups: [] }
};
/* ==================== ХРАНИЛИЩЕ ==================== */
let usingCloud = !!(window.storage && window.storage.get);
let DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
async function loadData(){
try{
if(usingCloud){
const res = await window.storage.get(STORAGE_KEY, true);
if(res && res.value){ DATA = JSON.parse(res.value); return; }
} else {
const raw = localStorage.getItem(STORAGE_KEY);
if(raw){ DATA = JSON.parse(raw); return; }
}
}catch(e){}
DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
}
async function saveData(){
const str = JSON.stringify(DATA);
try{
if(usingCloud){
await window.storage.set(STORAGE_KEY, str, true);
} else {
localStorage.setItem(STORAGE_KEY, str);
}
}catch(e){ console.error("Ошибка сохранения", e); alert("Не удалось сохранить данные."); }
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* ==================== TELEGRAM / АДМИН ==================== */
let tg = window.Telegram ? window.Telegram.WebApp : null;
let currentUserId = null;
let isAdmin = false;
function initTelegram(){
if(tg){
tg.ready(); tg.expand();
const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
if(u) currentUserId = u.id;
}
}
function toggleAdmin(){
if(isAdmin){ isAdmin = false; applyAdminState(); return; }
let idToCheck = currentUserId;
if(!idToCheck){
const entered = prompt("Введи свой Telegram ID:");
if(!entered) return;
idToCheck = parseInt(entered.trim(), 10);
}
if(ADMIN_IDS.includes(idToCheck)){
isAdmin = true;
applyAdminState();
} else {
alert("Этот Telegram ID не в списке администраторов.");
}
}
function applyAdminState(){
document.body.classList.toggle("admin", isAdmin);
document.getElementById("adminToggle").classList.toggle("on", isAdmin);
document.getElementById("modeLabel").textContent = isAdmin ? "режим админа" : "гость";
render();
}
/* ==================== НАВИГАЦИЯ ==================== */
let activeTab = "techcards";
let activeSub = { druzhba:"food", druzhbaSub:"all" };
document.getElementById("adminToggle").addEventListener("click", toggleAdmin);
document.getElementById("fabAdd").addEventListener("click", ()=> openAddModalForTab());
/* ==================== РЕНДЕР ==================== */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function render(){
// Рендер вкладок
const tabsRow = document.getElementById("tabsRow");
tabsRow.innerHTML = "";
DATA.tabs.forEach(t=>{
const btn = el(`<button class="tab-btn ${activeTab===t.id?'active':''}" data-tab="${t.id}">${t.icon} ${t.label}</button>`);
btn.addEventListener('click', ()=>{ activeTab = t.id; render(); });
if(isAdmin && !['techcards','druzhba','vodvore','procurement'].includes(t.id)){
const del = el(`<button class="tab-del">×</button>`);
del.addEventListener('click', (e)=>{
e.stopPropagation();
if(confirm(`Удалить вкладку «${t.label}»?`)){
DATA.tabs = DATA.tabs.filter(x=>x.id!==t.id);
if(activeTab===t.id) activeTab = 'techcards';
saveData(); render();
}
});
btn.appendChild(del);
}
tabsRow.appendChild(btn);
});
if(isAdmin){
const addBtn = el(`<button class="tab-btn" style="border-style:dashed;">+ Вкладка</button>`);
addBtn.addEventListener('click', openAddTabModal);
tabsRow.appendChild(addBtn);
}
// Рендер нижнего меню
const bottomNav = document.getElementById("bottomNav");
bottomNav.innerHTML = "";
DATA.tabs.slice(0,4).forEach(t=>{
const btn = el(`<button data-tab="${t.id}" class="${activeTab===t.id?'active':''}"><span class="ic">${t.icon}</span>${t.label}</button>`);
btn.addEventListener('click', ()=>{ activeTab = t.id; render(); });
bottomNav.appendChild(btn);
});
document.getElementById("fabAdd").classList.toggle("hidden", !isAdmin || activeTab==="procurement");
const main = document.getElementById("main");
main.innerHTML = "";
if(activeTab==="techcards") renderTechcards(main);
if(activeTab==="druzhba") renderDruzhba(main);
if(activeTab==="vodvore") renderVodvore(main);
if(activeTab==="procurement") renderProcurement(main);
// Проверка на кастомную вкладку
const customTab = DATA.tabs.find(t=>t.id===activeTab && !['techcards','druzhba','vodvore','procurement'].includes(t.id));
if(customTab) renderCustomTab(main, customTab);
}
/* ---------- ТЕХ.КАРТЫ ---------- */
function renderTechcards(main){
main.appendChild(el(`<h2 class="section-title">Тех.карты</h2>`));
if(!usingCloud) main.appendChild(el(`<div class="banner">⚠️ Облачное хранилище недоступно — данные сохраняются локально.</div>`));
if(DATA.techcards.length===0){
main.appendChild(el(`<div class="empty">Пока нет технологических карт.${isAdmin? ' Нажми «+», чтобы добавить.':''}</div>`));
return;
}
DATA.techcards.slice().reverse().forEach(tc=>{
const photos = (tc.photos||[]).length ? `<div class="photo-grid">${tc.photos.map(p=>`<img src="${p}">`).join("")}</div>` : "";
const card = el(`
<div class="card">
<h3>${escapeHtml(tc.name)}</h3>
<p>${escapeHtml(tc.ingredients||"")}</p>
${tc.steps? `<p><b>Приготовление:</b> ${escapeHtml(tc.steps)}</p>`:""}
${photos}
<div class="actions adminOnly">
<button class="btn btn-outline btn-sm" data-edit="${tc.id}">Изменить</button>
<button class="btn btn-danger btn-sm" data-del="${tc.id}">Удалить</button>
</div>
</div>`);
card.querySelector('[data-edit]')?.addEventListener('click', ()=> openTechcardModal(tc));
card.querySelector('[data-del]')?.addEventListener('click', ()=> deleteItem('techcards', tc.id));
main.appendChild(card);
});
}
function openTechcardModal(tc){
const editing = !!tc;
tc = tc || {id:uid(), name:"", ingredients:"", steps:"", photos:[]};
const body = `
<h3>${editing? "Изменить тех.карту":"Новая тех.карта"}</h3>
<div class="field"><label>Название</label><input type="text" id="f_name" value="${attr(tc.name)}"></div>
<div class="field"><label>Ингредиенты / состав</label><textarea id="f_ing">${escapeHtml(tc.ingredients)}</textarea></div>
<div class="field"><label>Как готовить</label><textarea id="f_steps">${escapeHtml(tc.steps)}</textarea></div>
<div class="field">
<label>Фото</label>
<input type="file" id="f_photo" accept="image/*" multiple>
<div class="photo-row" id="f_photoRow"></div>
</div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Сохранить</button>
</div>`;
const overlay = openModal(body);
let photos = (tc.photos||[]).slice();
renderPhotoRow();
function renderPhotoRow(){
const row = overlay.querySelector('#f_photoRow');
row.innerHTML = "";
photos.forEach((p,i)=>{
const w = el(`<div class="rm"><img src="${p}"><button data-i="${i}">×</button></div>`);
w.querySelector('button').addEventListener('click', ()=>{ photos.splice(i,1); renderPhotoRow(); });
row.appendChild(w);
});
}
overlay.querySelector('#f_photo').addEventListener('change', async (e)=>{
for(const file of e.target.files){
const dataUrl = await resizeImage(file);
photos.push(dataUrl);
}
renderPhotoRow();
});
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name){ alert("Укажи название"); return; }
tc.name = name;
tc.ingredients = overlay.querySelector('#f_ing').value.trim();
tc.steps = overlay.querySelector('#f_steps').value.trim();
tc.photos = photos;
upsert('techcards', tc);
await saveData();
closeModal(); render();
});
}
function resizeImage(file){
return new Promise((resolve)=>{
const reader = new FileReader();
reader.onload = (e)=>{
const img = new Image();
img.onload = ()=>{
const maxW = 400;
const scale = Math.min(1, maxW/img.width);
const canvas = document.createElement('canvas');
canvas.width = img.width*scale; canvas.height = img.height*scale;
const ctx = canvas.getContext('2d');
ctx.drawImage(img,0,0,canvas.width,canvas.height);
resolve(canvas.toDataURL('image/jpeg', 0.6));
};
img.src = e.target.result;
};
reader.readAsDataURL(file);
});
}
/* ---------- ДРУЖБА КРЕПКАЯ ---------- */
function renderDruzhba(main){
main.appendChild(el(`<h2 class="section-title">Дружба крепкая</h2>`));
const cats = DATA.druzhba.categories;
const subRow = el(`<div class="subtabs"></div>`);
cats.forEach(c=>{
const b = el(`<div class="subtab ${activeSub.druzhba===c.id?'active':''}">${c.label}</div>`);
b.addEventListener('click', ()=>{ activeSub.druzhba=c.id; activeSub.druzhbaSub = c.subcats[0]?.id || 'all'; render(); });
if(isAdmin){
const del = el(`<button class="sub-del">×</button>`);
del.addEventListener('click', (e)=>{
e.stopPropagation();
if(confirm(`Удалить категорию «${c.label}»?`)){
DATA.druzhba.categories = DATA.druzhba.categories.filter(x=>x.id!==c.id);
DATA.druzhba.items = DATA.druzhba.items.filter(x=>x.cat!==c.id);
if(activeSub.druzhba===c.id) activeSub.druzhba = DATA.druzhba.categories[0]?.id || 'food';
saveData(); render();
}
});
b.appendChild(del);
}
subRow.appendChild(b);
});
if(isAdmin){
const addCatBtn = el(`<button class="subtab-add">+</button>`);
addCatBtn.addEventListener('click', openAddDruzhbaCatModal);
subRow.appendChild(addCatBtn);
}
main.appendChild(subRow);
// Подкатегории
const currentCat = cats.find(c=>c.id===activeSub.druzhba);
if(currentCat && currentCat.subcats.length > 0){
const subSubRow = el(`<div class="subtabs" style="margin-top:-8px;"></div>`);
currentCat.subcats.forEach(sc=>{
const b = el(`<div class="subtab ${activeSub.druzhbaSub===sc.id?'active':''}" style="font-size:11.5px; padding:5px 10px;">${sc.label}</div>`);
b.addEventListener('click', ()=>{ activeSub.druzhbaSub=sc.id; render(); });
if(isAdmin && sc.id !== 'all'){
const del = el(`<button class="sub-del">×</button>`);
del.addEventListener('click', (e)=>{
e.stopPropagation();
if(confirm(`Удалить подкатегорию «${sc.label}»?`)){
currentCat.subcats = currentCat.subcats.filter(x=>x.id!==sc.id);
DATA.druzhba.items = DATA.druzhba.items.filter(x=>x.subcat!==sc.id);
if(activeSub.druzhbaSub===sc.id) activeSub.druzhbaSub = 'all';
saveData(); render();
}
});
b.appendChild(del);
}
subSubRow.appendChild(b);
});
if(isAdmin){
const addSubBtn = el(`<button class="subtab-add" style="font-size:12px; padding:5px 9px;">+</button>`);
addSubBtn.addEventListener('click', ()=> openAddDruzhbaSubcatModal(currentCat));
subSubRow.appendChild(addSubBtn);
}
main.appendChild(subSubRow);
}
const items = DATA.druzhba.items.filter(x=>x.cat===activeSub.druzhba && (activeSub.druzhbaSub==='all' || x.subcat===activeSub.druzhbaSub));
if(items.length===0){
const catLabel = currentCat?.label || '';
main.appendChild(el(`<div class="empty">Пока пусто${catLabel? ' в «'+catLabel+'»':''}.</div>`));
return;
}
items.slice().reverse().forEach(it=>{
const card = el(`
<div class="card">
<h3>${escapeHtml(it.title)}</h3>
<p>${escapeHtml(it.text)}</p>
<div class="actions adminOnly">
<button class="btn btn-outline btn-sm" data-edit="${it.id}">Изменить</button>
<button class="btn btn-danger btn-sm" data-del="${it.id}">Удалить</button>
</div>
</div>`);
card.querySelector('[data-edit]')?.addEventListener('click', ()=> openDruzhbaModal(it));
card.querySelector('[data-del]')?.addEventListener('click', ()=> deleteDruzhbaItem(it.id));
main.appendChild(card);
});
}
function openAddDruzhbaCatModal(){
const body = `
<h3>Новая категория</h3>
<div class="field"><label>Название (например: «Коктейли», «Десерты»)</label><input type="text" id="f_name"></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Добавить</button>
</div>`;
const overlay = openModal(body);
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name) return;
DATA.druzhba.categories.push({id:uid(), name, subcats:[{id:'all', label:'Все'}]});
await saveData(); closeModal(); render();
});
}
function openAddDruzhbaSubcatModal(cat){
const body = `
<h3>Новая подкатегория в «${escapeHtml(cat.label)}»</h3>
<div class="field"><label>Название (например: «Красное», «Белое»)</label><input type="text" id="f_name"></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Добавить</button>
</div>`;
const overlay = openModal(body);
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name) return;
cat.subcats.push({id:uid(), name});
await saveData(); closeModal(); render();
});
}
function openDruzhbaModal(it){
const editing = !!it;
it = it || {id:uid(), cat: activeSub.druzhba, subcat: activeSub.druzhbaSub, title:"", text:""};
const currentCat = DATA.druzhba.categories.find(c=>c.id===it.cat);
const body = `
<h3>${editing?"Изменить запись":"Новая запись"}</h3>
<div class="field"><label>Категория</label>
<div class="chipselect" id="f_cat">
${DATA.druzhba.categories.map(c=>`<div class="opt ${it.cat===c.id?'sel':''}" data-v="${c.id}">${c.label}</div>`).join("")}
</div>
</div>
<div class="field"><label>Подкатегория</label>
<div class="chipselect" id="f_subcat">
${(currentCat?.subcats||[]).map(sc=>`<div class="opt ${it.subcat===sc.id?'sel':''}" data-v="${sc.id}">${sc.label}</div>`).join("")}
</div>
</div>
<div class="field"><label>Заголовок</label><input type="text" id="f_title" value="${attr(it.title)}"></div>
<div class="field"><label>Описание</label><textarea id="f_text">${escapeHtml(it.text)}</textarea></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Сохранить</button>
</div>`;
const overlay = openModal(body);
let cat = it.cat;
let subcat = it.subcat;
overlay.querySelectorAll('#f_cat .opt').forEach(o=> o.addEventListener('click', ()=>{
cat = o.dataset.v;
overlay.querySelectorAll('#f_cat .opt').forEach(x=>x.classList.toggle('sel', x===o));
// Обновить подкатегории
const newCat = DATA.druzhba.categories.find(c=>c.id===cat);
const subcatRow = overlay.querySelector('#f_subcat');
subcatRow.innerHTML = (newCat?.subcats||[]).map(sc=>`<div class="opt" data-v="${sc.id}">${sc.label}</div>`).join("");
subcat = newCat?.subcats[0]?.id || 'all';
subcatRow.querySelectorAll('.opt').forEach(o=> o.addEventListener('click', ()=>{
subcat = o.dataset.v;
subcatRow.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel', x===o));
}));
}));
overlay.querySelectorAll('#f_subcat .opt').forEach(o=> o.addEventListener('click', ()=>{
subcat = o.dataset.v;
overlay.querySelectorAll('#f_subcat .opt').forEach(x=>x.classList.toggle('sel', x===o));
}));
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const title = overlay.querySelector('#f_title').value.trim();
if(!title){ alert("Укажи заголовок"); return; }
it.title = title; it.cat = cat; it.subcat = subcat;
it.text = overlay.querySelector('#f_text').value.trim();
upsertDruzhbaItem(it);
await saveData(); closeModal(); render();
});
}
function upsertDruzhbaItem(item){
const idx = DATA.druzhba.items.findIndex(x=>x.id===item.id);
if(idx>=0) DATA.druzhba.items[idx]=item; else DATA.druzhba.items.push(item);
}
async function deleteDruzhbaItem(id){
if(!confirm("Удалить запись?")) return;
DATA.druzhba.items = DATA.druzhba.items.filter(x=>x.id!==id);
await saveData(); render();
}
/* ---------- ВО ДВОРЕ ---------- */
function renderVodvore(main){
main.appendChild(el(`<h2 class="section-title">Во дворе — коктейли</h2>`));
if(DATA.vodvore.length===0){ main.appendChild(el(`<div class="empty">Пока нет коктейлей.</div>`)); return; }
DATA.vodvore.slice().reverse().forEach(c=>{
const tastes = (c.tastes||[]).map(t=>`<span class="chip">${t}</span>`).join("");
const card = el(`
<div class="card">
<h3>${escapeHtml(c.name)}</h3>
<div class="meta">${tastes}</div>
${c.composition? `<p><b>Состав:</b> ${escapeHtml(c.composition)}</p>`:""}
${c.text? `<p>${escapeHtml(c.text)}</p>`:""}
<div class="actions adminOnly">
<button class="btn btn-outline btn-sm" data-edit="${c.id}">Изменить</button>
<button class="btn btn-danger btn-sm" data-del="${c.id}">Удалить</button>
</div>
</div>`);
card.querySelector('[data-edit]')?.addEventListener('click', ()=> openVodvoreModal(c));
card.querySelector('[data-del]')?.addEventListener('click', ()=> deleteItem('vodvore', c.id));
main.appendChild(card);
});
}
function openVodvoreModal(c){
const editing = !!c;
c = c || {id:uid(), name:"", tastes:[], composition:"", text:""};
const body = `
<h3>${editing?"Изменить коктейль":"Новый коктейль"}</h3>
<div class="field"><label>Название</label><input type="text" id="f_name" value="${attr(c.name)}"></div>
<div class="field"><label>Вкусовые свойства</label>
<div class="chipselect" id="f_tastes">
${TASTE_TAGS.map(t=>`<div class="opt ${c.tastes.includes(t)?'sel':''}" data-v="${t}">${t}</div>`).join("")}
</div>
</div>
<div class="field"><label>Состав</label><textarea id="f_comp">${escapeHtml(c.composition)}</textarea></div>
<div class="field"><label>Заметки</label><textarea id="f_text">${escapeHtml(c.text)}</textarea></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Сохранить</button>
</div>`;
const overlay = openModal(body);
let tastes = new Set(c.tastes);
overlay.querySelectorAll('#f_tastes .opt').forEach(o=> o.addEventListener('click', ()=>{
const v = o.dataset.v;
if(tastes.has(v)){ tastes.delete(v); o.classList.remove('sel'); } else { tastes.add(v); o.classList.add('sel'); }
}));
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name){ alert("Укажи название"); return; }
c.name = name; c.tastes = Array.from(tastes);
c.composition = overlay.querySelector('#f_comp').value.trim();
c.text = overlay.querySelector('#f_text').value.trim();
upsert('vodvore', c);
await saveData(); closeModal(); render();
});
}
/* ---------- ЗАКУПКИ ---------- */
function renderProcurement(main){
main.appendChild(el(`<h2 class="section-title">Закупки</h2>`));
const addGroupBtn = el(`<button class="btn btn-primary btn-sm adminOnly block" style="margin-bottom:12px;">+ Добавить группу поставщика</button>`);
addGroupBtn.addEventListener('click', openAddGroupModal);
main.appendChild(addGroupBtn);
if(DATA.procurement.groups.length===0){
main.appendChild(el(`<div class="empty">Пока нет групп закупок.</div>`));
} else {
DATA.procurement.groups.forEach(g=>{
const gb = el(`<div class="group-block"></div>`);
const head = el(`
<div class="group-head">
<h3>${escapeHtml(g.name)}</h3>
<div class="adminOnly" style="display:flex; gap:6px;">
<button class="btn btn-outline btn-sm" data-sub="${g.id}">+ Подгруппа</button>
<button class="btn btn-danger btn-sm" data-delg="${g.id}">Удалить</button>
</div>
</div>`);
head.querySelector('[data-sub]')?.addEventListener('click', ()=> openAddSubgroupModal(g));
head.querySelector('[data-delg]')?.addEventListener('click', ()=>{
if(confirm(`Удалить группу «${g.name}»?`)){
DATA.procurement.groups = DATA.procurement.groups.filter(x=>x.id!==g.id);
saveData(); render();
}
});
gb.appendChild(head);
(g.subgroups||[]).forEach(sg=>{
const sgTitle = el(`<div class="subgroup-title">${escapeHtml(sg.name)}</div>`);
gb.appendChild(sgTitle);
const addProdBtn = el(`<button class="btn btn-outline btn-sm adminOnly" style="margin-bottom:8px;">+ Товар в «${escapeHtml(sg.name)}»</button>`);
addProdBtn.addEventListener('click', ()=> openAddProductModal(g, sg));
gb.appendChild(addProdBtn);
if((sg.products||[]).length===0){
gb.appendChild(el(`<div class="empty" style="padding:14px;">Нет товаров</div>`));
}
(sg.products||[]).forEach(p=>{
const line = el(`
<div class="prod-line">
<div class="info"><b>${escapeHtml(p.name)}</b><span>${escapeHtml(p.unit||"")}${p.comment? " · "+escapeHtml(p.comment):""}</span></div>
<input type="number" min="0" class="qty" data-pid="${p.id}" placeholder="0">
<button class="btn btn-danger btn-sm adminOnly" data-delp="${p.id}">×</button>
</div>`);
line.querySelector('[data-delp]')?.addEventListener('click', ()=>{
sg.products = sg.products.filter(x=>x.id!==p.id);
saveData(); render();
});
gb.appendChild(line);
});
});
main.appendChild(gb);
});
}
// Фиксированная кнопка "Собрать заказ"
const collectBtn = el(`<button class="fixed-collect-btn">Собрать список закупок</button>`);
collectBtn.addEventListener('click', collectShoppingList);
main.appendChild(collectBtn);
main.appendChild(el(`<div id="shopResult" class="hidden" style="margin-bottom:80px;"></div>`));
}
function openAddGroupModal(){
const body = `
<h3>Новая группа поставщика</h3>
<div class="field"><label>Название (например: «Хозка», «Пиво»)</label><input type="text" id="f_name"></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Добавить</button>
</div>`;
const overlay = openModal(body);
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name) return;
DATA.procurement.groups.push({id:uid(), name, subgroups:[]});
await saveData(); closeModal(); render();
});
}
function openAddSubgroupModal(g){
const body = `
<h3>Новая подгруппа в «${escapeHtml(g.name)}»</h3>
<div class="field"><label>Название подгруппы</label><input type="text" id="f_name"></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Добавить</button>
</div>`;
const overlay = openModal(body);
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name) return;
g.subgroups = g.subgroups || [];
g.subgroups.push({id:uid(), name, products:[]});
await saveData(); closeModal(); render();
});
}
function openAddProductModal(g, sg){
const body = `
<h3>Новый товар в «${escapeHtml(sg.name)}»</h3>
<div class="field"><label>Название товара</label><input type="text" id="f_name"></div>
<div class="field"><label>Единица измерения (шт, кг, л...)</label><input type="text" id="f_unit"></div>
<div class="field"><label>Комментарий</label><input type="text" id="f_comment"></div>
<div class="modal-actions">
<button class="btn btn-outline" id="mCancel">Отмена</button>
<button class="btn btn-primary" id="mSave">Добавить</button>
</div>`;
const overlay = openModal(body);
overlay.querySelector('#mCancel').addEventListener('click', closeModal);
overlay.querySelector('#mSave').addEventListener('click', async ()=>{
const name = overlay.querySelector('#f_name').value.trim();
if(!name) return;
sg.products = sg.products || [];
sg.products.push({id:uid(), name, unit:overlay.querySelector('#f_unit').value.trim(), comment:overlay.querySelector('#f_comment').value.trim()});
await saveData(); closeModal(); render();
});
}
function collectShoppingList(){
let out = "";
DATA.procurement.groups.forEach(g=>{
let groupLines = [];
(g.subgroups||[]).forEach(sg=>{
(sg.products||[]).forEach(p=>{
const input = document.querySelector(`.qty[data-pid="${p.id}"]`);
const qty = input ? parseFloat(input.value) : 0;
if(qty && qty>0){
groupLines.push(`— ${p.name}: ${qty}${p.unit? " "+p.unit:""}${p.comment? " ("+p.comment+")":""}`);
}
});
});
if(groupLines.length){
out += `📦 ${g.name}\n` + groupLines.join("\n") + "\n\n";
}
});
const resultBox = document.getElementById('shopResult');
if(!out){ alert("Укажи количество хотя бы для одного товара."); return; }
resultBox.textContent = out.trim();
resultBox.classList.remove('hidden');
resultBox.scrollIntoView({behavior:'smooth', block:'nearest'});
}

main.appendChild(el(`<h2 class="section-title">${tab.icon} ${escapeHtml(tab.label)}</h2>`));
main.appendChild(el(`<div class="empty">Это кастомная вкладка. Добавь сюда свой контент.</div>`));
}
function openAddTabModal(){
const body = `
<h3>Новая вкладка</h3>
<div class="field"><label>Название</label><input type="text" id="f_name"></div>
<div class="field"><label>Иконка (эмодзи)</label><input type="text" id="f_icon" value="📌" maxlength="2"></div>

overlay.querySelector('#mCancel').addEventListener('click', closeModal);

const name = overlay.querySelector('#f_name').value.trim();
const icon = overlay.querySelector('#f_icon').value.trim() || '📌';
if(!name) return;
DATA.tabs.push({id:uid(), name, icon});
await saveData(); closeModal(); render();
});
}
/* ==================== ОБЩИЕ ХЕЛПЕРЫ ==================== */
function upsert(section, item){
const arr = DATA[section];
const idx = arr.findIndex(x=>x.id===item.id);
if(idx>=0) arr[idx]=item; else arr.push(item);
}
async function deleteItem(section, id){
if(!confirm("Удалить запись?")) return;
DATA[section] = DATA[section].filter(x=>x.id!==id);
await saveData(); render();
}
function openAddModalForTab(){
if(activeTab==="techcards") openTechcardModal(null);
if(activeTab==="druzhba") openDruzhbaModal(null);
if(activeTab==="vodvore") openVodvoreModal(null);
}
function openModal(innerHtml){
const overlay = el(`<div id="modalOverlay"><div id="modal">${innerHtml}</div></div>`);
overlay.addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
document.body.appendChild(overlay);
return overlay;
}
function closeModal(){ document.getElementById('modalOverlay')?.remove(); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function attr(s){ return escapeHtml(s); }
/* ==================== СТАРТ ==================== */
(async function start(){
initTelegram();
await loadData();
render();
})();
</script>
