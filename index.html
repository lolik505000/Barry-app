<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Барри</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Firebase (используется только если ниже в коде заполнен FIREBASE_CONFIG) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<!-- Сканер штрихкодов (для вкладки Пиво) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --curtain: #9E3232;
    --curtain-text: #FFD700;
    --bg: #163420;
    --bg-soft: #1E4429;
    --card: #1B3D26;
    --card-border: #2E5A3B;
    --text: #F4F4F0;
    --text-dim: #C9D6CC;
    --accent: #FFD700;
    --danger: #C24B4B;
    --radius: 14px;
  }
  body.theme-light{
    --bg: #F3EEE1;
    --bg-soft: #E9E1CC;
    --card: #FFFFFF;
    --card-border: #DCD3B8;
    --text: #2A2A22;
    --text-dim: #6B6656;
    --accent: #B8860B;
    --danger: #B23A3A;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{height:100%;}
  body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column;
    height:100vh; height:100dvh; /* dvh переопределит vh там где поддерживается */
    overflow:hidden;
  }

  /* ===== ШТОРКА (верхняя панель) — всегда сверху, в потоке, не scroll ===== */
  #curtain{
    flex:0 0 auto; z-index:50;
    background:var(--curtain); color:var(--curtain-text);
    padding:10px 14px; display:flex; align-items:center; justify-content:space-between;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  #curtain .brand{display:flex; align-items:center; gap:10px;}
  #curtain .logo{width:42px; height:42px; border-radius:10px; background:rgba(255,215,0,.12); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0;}
  #curtain .logo svg{width:100%; height:100%;}
  #curtain .titles{display:flex; flex-direction:column; line-height:1.15;}
  #curtain .titles b{font-size:17px; letter-spacing:.5px;}
  #curtain .titles span{font-size:11px; opacity:.85; font-weight:600;}
  #curtain .gear{width:38px; height:38px; border-radius:10px; border:1.5px solid var(--curtain-text); background:transparent; color:var(--curtain-text); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px;}
  #curtain .gear.on{background:var(--curtain-text); color:var(--curtain);}
  #curtain .curtain-actions{display:flex; gap:8px; align-items:center;}

  /* ===== ПОИСК ===== */
  #searchOverlay{position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:110; display:flex; flex-direction:column;}
  #searchTop{flex:0 0 auto; background:var(--curtain); padding:10px 12px; display:flex; gap:8px; align-items:center;}
  #searchInput{flex:1; border:1.5px solid rgba(255,215,0,.5); background:rgba(0,0,0,.2); color:var(--curtain-text); border-radius:10px; padding:10px 12px; font-size:15px;}
  #searchInput::placeholder{color:rgba(255,215,0,.6);}
  #searchClose{background:transparent; border:none; color:var(--curtain-text); font-size:22px; cursor:pointer; padding:0 6px;}
  #searchResults{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px;}
  .search-hit{background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:11px 13px; margin-bottom:9px; cursor:pointer;}
  .search-hit .hit-cat{font-size:10.5px; color:var(--accent); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:3px;}
  .search-hit .hit-title{font-size:14.5px; font-weight:700;}
  .search-hit .hit-tags{margin-top:5px;}
  .search-hint{color:var(--text-dim); font-size:13px; text-align:center; padding:30px 12px;}

  #tabsRow{
    flex:0 0 auto; z-index:49;
    background:var(--curtain); display:flex; gap:6px; padding:0 10px 8px 10px; overflow-x:auto;
  }
  #tabsRow::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto; padding:7px 13px; border-radius:999px; border:1.5px solid rgba(255,215,0,.4);
    background:transparent; color:var(--curtain-text); font-size:12.5px; font-weight:700; white-space:nowrap; cursor:pointer;
  }
  .tab-btn.active{background:var(--curtain-text); color:var(--curtain); border-color:var(--curtain-text);}

  /* ===== СКРОЛЛ-ОБЛАСТЬ — единственное, что скроллится ===== */
  #scrollArea{
    flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:14px; padding-bottom:28px;
  }

  .hidden{display:none !important;}

  h2.section-title{font-size:19px; margin:2px 0 12px 0; letter-spacing:.3px; display:flex; align-items:center; justify-content:space-between;}
  .pillrow{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center;}
  .pill{padding:6px 12px; border-radius:999px; background:var(--bg-soft); border:1px solid var(--card-border); color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer;}
  .pill.active{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .pill.addpill{background:transparent; border:1.5px dashed rgba(255,215,0,.5); color:var(--accent);}
  .pill.sm{padding:5px 10px; font-size:11.5px;}

  .card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px;}
  .card h3{margin:0 0 4px 0; font-size:15.5px;}
  .card p{margin:4px 0; font-size:13.5px; color:var(--text-dim); line-height:1.45;}
  .chip{display:inline-block; background:rgba(255,215,0,.14); color:var(--accent); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:700; margin:2px 4px 2px 0;}
  .card .meta{display:flex; flex-wrap:wrap; margin-top:6px;}
  .card .actions{display:flex; gap:8px; margin-top:10px;}
  .card img.thumb{width:100%; border-radius:10px; margin-top:8px; display:block;}
  .empty{color:var(--text-dim); font-size:13.5px; text-align:center; padding:26px 10px; border:1.5px dashed var(--card-border); border-radius:var(--radius);}

  button.btn{border:none; border-radius:10px; padding:9px 14px; font-weight:700; font-size:13px; cursor:pointer;}
  button.btn-primary{background:var(--accent); color:#2b2200;}
  button.btn-outline{background:transparent; color:var(--text); border:1.5px solid var(--card-border);}
  button.btn-danger{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  button.btn-sm{padding:6px 10px; font-size:12px;}
  button.btn-block{width:100%; margin:10px 0;}
  .fab{position:fixed; right:16px; bottom:80px; z-index:40; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#2b2200; font-size:26px; border:none; box-shadow:0 6px 16px rgba(0,0,0,.4); cursor:pointer;}

  #bottomNav{flex:0 0 auto; background:var(--bg-soft); border-top:1px solid var(--card-border); display:flex; z-index:45;}
  #bottomNav button{flex:1; background:none; border:none; color:var(--text-dim); padding:9px 2px 8px; font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
  #bottomNav button span.ic{font-size:19px;}
  #bottomNav button.active{color:var(--accent);}

  /* modal */
  #modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100; display:flex; align-items:flex-end; justify-content:center;}
  #modal{background:var(--bg-soft); width:100%; max-width:520px; max-height:88vh; overflow-y:auto; -webkit-overflow-scrolling:touch; border-radius:18px 18px 0 0; padding:16px 16px 22px;}
  #modal h3{margin:0 0 12px 0;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px; font-weight:600;}
  .field .hint{font-size:11px; color:var(--text-dim); opacity:.75; margin-top:4px;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:10px; padding:9px 11px; font-size:14px; font-family:inherit;
  }
  .field textarea{min-height:70px; resize:vertical;}
  .chipselect{display:flex; flex-wrap:wrap; gap:7px;}
  .chipselect .opt{padding:6px 11px; border-radius:999px; border:1.5px solid var(--card-border); font-size:12.5px; cursor:pointer; color:var(--text-dim);}
  .chipselect .opt.sel{background:var(--accent); color:#2b2200; border-color:var(--accent);}
  .modal-actions{display:flex; gap:10px; margin-top:14px;}
  .modal-actions button{flex:1;}
  .photo-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
  .photo-row img{width:70px; height:70px; object-fit:cover; border-radius:8px; border:1.5px solid var(--card-border);}
  .photo-row .rm{position:relative;}
  .photo-row .rm button{position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; background:var(--danger); color:#fff; border:none; font-size:12px; line-height:1;}

  .adminOnly{display:none;}
  body.editmode .adminOnly{display:inline-flex;}
  body.editmode .adminOnly.block{display:block;}
  body.editmode .adminOnly.pill{display:inline-block;}
  #editToggle.on{background:var(--curtain-text); color:var(--curtain);}

  .banner{background:rgba(255,215,0,.1); border:1px solid rgba(255,215,0,.35); color:var(--accent); font-size:12px; padding:8px 12px; border-radius:10px; margin-bottom:12px;}
  .subhead{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:10px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .prod-line{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:9px 11px; margin-bottom:7px;}
  .prod-line .info{flex:1; min-width:0;}
  .prod-line .info b{font-size:13.5px; display:block;}
  .prod-line .info span{font-size:11.5px; color:var(--text-dim);}
  .prod-line input.qty{width:58px; text-align:center; background:var(--bg); border:1.5px solid var(--card-border); color:var(--text); border-radius:8px; padding:6px 4px; font-size:13px; flex-shrink:0;}
  .group-block{margin-bottom:16px;}
  .group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; gap:8px;}
  .group-head h3{margin:0; font-size:15px; color:var(--accent);}
  .subgroup-title{font-size:12.5px; color:var(--text-dim); font-weight:700; margin:8px 0 6px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .tc-group{margin-bottom:12px;}
  .tc-group-head{display:flex; align-items:center; gap:8px; background:var(--bg-soft); border:1px solid var(--card-border); border-radius:12px; padding:10px 12px; cursor:pointer;}
  .tc-group-head b{flex:1; font-size:14.5px;}
  .tc-group-head .arrow{transition:transform .18s; font-size:13px; color:var(--accent);}
  .tc-group-head.collapsed .arrow{transform:rotate(-90deg);}
  .tc-group-body{padding-top:10px;}
  .tc-group-body.collapsed{display:none;}
  .tc-group-del{margin-left:4px;}
  #shopResult{white-space:pre-wrap; background:var(--card); border:1px solid var(--card-border); border-radius:10px; padding:12px; font-size:13px; line-height:1.6; margin-top:12px;}
  #shopStickyWrap{position:sticky; bottom:0; background:var(--bg); padding-top:8px; margin-top:4px;}

  /* ===== СВОРАЧИВАЕМОЕ ОПИСАНИЕ В КАРТОЧКАХ ===== */
  .card-head-row{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .card-head-row h3{margin:0; flex:1;}
  .card-head-row .desc-arrow{font-size:12px; color:var(--accent); transition:transform .18s; flex-shrink:0;}
  .card-head-row .desc-arrow.collapsed{transform:rotate(-90deg);}
  .card-body{overflow:hidden;}
  .card-body.collapsed{display:none;}

  /* ===== ПИВО ===== */
  .beer-price{font-size:17px; font-weight:800; color:var(--accent);}
  .beer-search{width:100%; background:var(--bg-soft); border:1.5px solid var(--card-border); color:var(--text); border-radius:10px; padding:9px 12px; font-size:14px; margin-bottom:12px;}

  /* ===== СКАНЕР ШТРИХКОДОВ ===== */
  #scanOverlay{position:fixed; inset:0; background:#000; z-index:120; display:flex; flex-direction:column;}
  #scanTop{flex:0 0 auto; padding:12px; display:flex; justify-content:space-between; align-items:center; background:var(--curtain);}
  #scanTop b{color:var(--curtain-text);}
  #scanClose{background:transparent; border:none; color:var(--curtain-text); font-size:22px; cursor:pointer;}
  #reader{flex:1;}
  #scanResult{flex:0 0 auto; padding:16px; background:var(--bg-soft);}
</style>
</head>

<script>

const SECTION_KEYS = {
  techcards: "barry_techcards_v2",

};
const LEGACY_KEY = "barry-shared-data"; // ключ старой версии приложения, для миграции

const DEFAULT_CUSTOM_TABS = [
  { id:"druzhba", name:"Дружба крепкая", categories:[
    { id:"food", name:"Еда", notes:[] },
    { id:"wine", name:"Вино", notes:[] }
  ]},

    { id:"cocktails", name:"Коктейли", notes:[] }
  ]}
];

// приводим старые данные (с подкатегориями) к новому плоскому виду: вкладка → категория → записи
function flattenCustomTabs(tabs){
  (tabs||[]).forEach(t=>{
    (t.categories||[]).forEach(c=>{
      if(Array.isArray(c.subcategories)){
        const merged = [];
        c.subcategories.forEach(s=> merged.push(...(s.notes||[])));
        c.notes = merged;
        delete c.subcategories;
      } else if(!Array.isArray(c.notes)){
        c.notes = [];
      }
    });
  });
  return tabs;
}

/* ==================== ДАННЫЕ ==================== */
let DATA = {
  techcards: [],
  techcardGroups: [], // {id, name}
  customTabs: JSON.parse(JSON.stringify(DEFAULT_CUSTOM_TABS)),
  vodvore: [], // легаси, используется только для одноразовой миграции в Партнёры → Во дворе
  procurement: { groups: [] },
  settings: { maintenance: false },
  beer: [], // {id, name, tags, description, price, barcode}
  reservations: [] // {id, date, time, name, phone, count, deposit, table}
};

let pendingScrollId = null; // id элемента, к которому нужно проскроллить после следующего рендера

// собрать все теги+названия по всем разделам в единый плоский список для поиска
// (закупки сюда сознательно не включаем — ими редко ищут, лишний шум)
function buildSearchIndex(){
  const idx = [];
  DATA.techcards.forEach(tc=> idx.push({
    label: tc.name, tags: tc.tags||[], category: "Тех.карты",
    go: ()=>{ activeTab="techcards"; collapsedGroups[tc.groupId||"__none"]=false; pendingScrollId = tc.groupId? `tcgroup-${tc.groupId}` : null; }
  }));
  DATA.customTabs.forEach(t=>{
    (t.categories||[]).forEach(c=>{
      (c.notes||[]).forEach(n=> idx.push({
        label: n.title, tags: n.tags||[], category: `Партнёры → ${t.name} → ${c.name}`,
        go: ()=>{ activeTab="partners"; collapsedTabs[t.id]=false; collapsedCats[c.id]=false; pendingScrollId = `pcat-${c.id}`; }
      }));
    });
  });
  DATA.beer.forEach(b=> idx.push({
    label: b.name, tags: b.tags||[], category: "Пиво",
    go: ()=>{ activeTab="beer"; pendingScrollId = `beer-${b.id}`; }
  }));
  return idx;
}

function runSearch(query){
  const q = query.trim().toLowerCase();
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = "";
  if(!q){ resultsEl.appendChild(el(`<div class="search-hint">Начни вводить название или тег — ищем сразу везде: тех.карты и партнёры.</div>`)); return; }
  const idx = buildSearchIndex();
  const hits = idx.filter(item=>{
    if(item.label && item.label.toLowerCase().includes(q)) return true;
    return (item.tags||[]).some(t=> t.toLowerCase().includes(q));
  });
  if(!hits.length){ resultsEl.appendChild(el(`<div class="search-hint">Ничего не нашлось.</div>`)); return; }
  hits.forEach(hit=>{
    const tagsHtml = (hit.tags||[]).length? `<div class="hit-tags">${hit.tags.map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join("")}</div>` : "";
    const row = el(`
      <div class="search-hit">
        <div class="hit-cat">${escapeHtml(hit.category)}</div>
        <div class="hit-title">${escapeHtml(hit.label)}</div>
        ${tagsHtml}
      </div>`);
    row.addEventListener('click', ()=>{ hit.go(); closeSearch(); render(); });
    resultsEl.appendChild(row);
  });
}

function openSearch(){
  document.getElementById('searchOverlay').classList.remove('hidden');
  const input = document.getElementById('searchInput');
  input.value = "";
  runSearch("");
  setTimeout(()=> input.focus(), 50);
}
function closeSearch(){ document.getElementById('searchOverlay').classList.add('hidden'); }

// теги "через запятую" -> массив
function parseTags(str){
  return (str||"").split(",").map(s=>s.trim()).filter(Boolean);
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ==================== ХРАНИЛИЩЕ ==================== */
let storageMode = "local"; // 'firebase' | 'cloud' | 'local'
let db = null;

function firebaseConfigured(){ return !!(FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey); }

function initStorage(){
  if(firebaseConfigured() && window.firebase){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      storageMode = "firebase";
      return;
    }catch(e){ console.error("Firebase init error", e); }
  }
  if(window.storage && window.storage.get){ storageMode = "cloud"; return; }
  storageMode = "local";
}

async function loadSectionRaw(section){
  const key = SECTION_KEYS[section];
  try{
    if(storageMode === "firebase"){
      const snap = await db.collection("barry").doc(section).get();
      return snap.exists ? snap.data().payload : null;
    } else if(storageMode === "cloud"){
      const res = await window.storage.get(key, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
}

async function saveSection(section){
  const key = SECTION_KEYS[section];
  const value = DATA[section];
  try{
    if(storageMode === "firebase"){
      await db.collection("barry").doc(section).set({payload:value});
    } else if(storageMode === "cloud"){
      await window.storage.set(key, JSON.stringify(value), true);
    } else {
      localStorage.setItem(key, JSON.stringify(value));
    }
  }catch(e){
    console.error("Ошибка сохранения", e);
    alert("Не удалось сохранить. Возможно, слишком много крупных фото — попробуй уменьшить их количество.");
  }
}

async function loadLegacyBlob(){
  try{
    if(storageMode === "cloud"){
      const res = await window.storage.get(LEGACY_KEY, true);
      return res && res.value ? JSON.parse(res.value) : null;
    } else if(storageMode === "local"){
      const raw = localStorage.getItem(LEGACY_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }catch(e){ return null; }
  return null;
}

async function loadAllData(){
  const [tc, tg_, ct, vd, pr, st, br, rs] = await Promise.all([
    loadSectionRaw("techcards"), loadSectionRaw("techcardGroups"), loadSectionRaw("customTabs"),
    loadSectionRaw("vodvore"), loadSectionRaw("procurement"), loadSectionRaw("settings"), loadSectionRaw("beer"), loadSectionRaw("reservations")
  ]);

  if(tc===null && tg_===null && ct===null && vd===null && pr===null && st===null && br===null && rs===null){
    // новых данных ещё нет — пробуем мигрировать со старой версии приложения
    const legacy = await loadLegacyBlob();
    if(legacy){
      DATA.techcards = legacy.techcards || [];
      DATA.procurement = legacy.procurement || {groups:[]};
      const tabs = JSON.parse(JSON.stringify(DEFAULT_CUSTOM_TABS));
      if(Array.isArray(legacy.druzhba) && legacy.druzhba.length){
        legacy.druzhba.forEach(item=>{
          const cat = tabs[0].categories.find(c=>c.id===item.cat) || tabs[0].categories[0];
          cat.notes.push({id:item.id||uid(), title:item.title, text:item.text, tags:item.tags||[]});
        });
      }
      if(Array.isArray(legacy.vodvore) && legacy.vodvore.length){
        const cocktailsCat = tabs[1].categories[0];
        legacy.vodvore.forEach(c=>{
          const tagList = [...(c.tastes||[]), ...(c.tags||[])];
          const textParts = [];
          if(c.composition) textParts.push("Состав: "+c.composition);
          if(c.text) textParts.push(c.text);
          cocktailsCat.notes.push({id:c.id||uid(), title:c.name, text:textParts.join(". "), tags:tagList});
        });
      }
      DATA.customTabs = tabs;
      DATA.settings = {maintenance:false};
      DATA.beer = [];
      DATA.reservations = [];
      await Promise.all(["techcards","techcardGroups","customTabs","procurement","settings","beer","reservations"].map(saveSection));
      return;
    }
  }

  if(tc) DATA.techcards = tc;
  if(tg_) DATA.techcardGroups = tg_;
  if(pr) DATA.procurement = pr;
  if(st) DATA.settings = st; else DATA.settings = {maintenance:false};
  if(br) DATA.beer = br;
  if(rs) DATA.reservations = rs;

  if(ct){
    DATA.customTabs = flattenCustomTabs(ct);
    // если в старой версии было отдельное "Во дворе" (массив vodvore) — один раз переносим в Партнёры
    if(Array.isArray(vd) && vd.length){
      let vodvoreTab = DATA.customTabs.find(t=>t.id==="vodvore") || DATA.customTabs.find(t=> /во\s*двор/i.test(t.name));
      if(!vodvoreTab){
        vodvoreTab = {id:"vodvore", name:"Во дворе", categories:[{id:"cocktails", name:"Коктейли", notes:[]}]};
        DATA.customTabs.push(vodvoreTab);
      }
      const targetCat = vodvoreTab.categories[0] || {id:uid(), name:"Коктейли", notes:[]};
      if(!vodvoreTab.categories.length) vodvoreTab.categories.push(targetCat);
      vd.forEach(c=>{
        const tagList = [...(c.tastes||[]), ...(c.tags||[])];
        const textParts = [];
        if(c.composition) textParts.push("Состав: "+c.composition);
        if(c.text) textParts.push(c.text);
        targetCat.notes.push({id:c.id||uid(), title:c.name, text:textParts.join(". "), tags:tagList});
      });
      DATA.vodvore = [];
      await Promise.all(["customTabs","vodvore"].map(saveSection));
    } else {
      await saveSection("customTabs"); // сохраняем на случай если flatten что-то изменил
    }
  }
}

function subscribeRealtime(){
  if(storageMode !== "firebase") return;
  Object.keys(SECTION_KEYS).forEach(section=>{
    db.collection("barry").doc(section).onSnapshot(snap=>{
      if(snap.exists){ DATA[section] = snap.data().payload; render(); }
    });
  });
}

/* ==================== TELEGRAM / АДМИН ==================== */
let tg = window.Telegram ? window.Telegram.WebApp : null;
let currentUserId = null;
let isAdmin = false;
let editMode = false;

function setAppHeight(){
  // Используем реальную высоту окна, а не tg.viewportStableHeight —
  // на Telegram Desktop оно иногда даёт неверное значение, из-за чего
  // приложение "сжималось" и снизу проглядывал старый закэшированный кадр.
  const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
  document.body.style.height = h + "px";
}

function initTelegram(){
  if(tg){
    tg.ready(); tg.expand();
    const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
    if(u) currentUserId = u.id;
  }
  // автоматически определяем администратора по Telegram ID — руками жать ничего не нужно
  if(currentUserId && ADMIN_IDS.includes(currentUserId)) isAdmin = true;
  setAppHeight();
  window.addEventListener("resize", setAppHeight);
  if(window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeight);
}

function manualAdminLogin(){
  const entered = prompt("Не удалось определить Telegram ID автоматически (запусти внутри Telegram).\nДля теста введи свой Telegram ID вручную:");
  if(!entered) return;
  const idToCheck = parseInt(entered.trim(), 10);
  if(ADMIN_IDS.includes(idToCheck)){
    currentUserId = idToCheck;
    isAdmin = true;
    applyAdminState();
    closeModal();
  } else {
    alert("Этот Telegram ID не в списке администраторов.");
  }
}

function toggleEditMode(){
  if(!isAdmin) return;
  editMode = !editMode;
  applyAdminState();
}

function applyAdminState(){
  document.body.classList.toggle("admin", isAdmin);
  document.body.classList.toggle("editmode", isAdmin && editMode);
  document.getElementById("editToggle").classList.toggle("hidden", !isAdmin);
  document.getElementById("editToggle").classList.toggle("on", editMode);
  document.getElementById("modeLabel").textContent = isAdmin ? (editMode? "режим редактирования" : "админ") : "гость";
  render();
}

function isMaintenanceActive(){
  return !FORCE_MAINTENANCE_OFF && DATA.settings && DATA.settings.maintenance && !isAdmin;
}

async function setMaintenance(on){
  DATA.settings = DATA.settings || {};
  DATA.settings.maintenance = on;
  await saveSection('settings');
  render();
}

function getTheme(){ return localStorage.getItem("barry_theme") || "dark"; }
function applyTheme(){
  document.body.classList.toggle("theme-light", getTheme()==="light");
}
function toggleTheme(){
  localStorage.setItem("barry_theme", getTheme()==="light" ? "dark" : "light");
  applyTheme();
}

function openSettingsModal(){
  const status = isAdmin ? (editMode? "режим редактирования включён" : "вы администратор") : "вы гость";
  const maintOn = DATA.settings && DATA.settings.maintenance;
  const lightOn = getTheme()==="light";
  const body = `
    <h3>Настройки</h3>

function techcardCardEl(tc){

  const tags = (tc.tags||[]).map(t=>`<span class="chip">${escapeHtml(t)}</span>`).join("");

  const card = el(`
    <div class="card">
      <div class="card-head-row">
        <h3>${escapeHtml(tc.name)}</h3>
        <span class="desc-arrow ${descCollapsed?'collapsed':''}">▼</span>
      </div>
      ${tags? `<div class="meta">${tags}</div>`:""}
      <div class="card-body ${descCollapsed?'collapsed':''}">
        <p>${escapeHtml(tc.ingredients||"")}</p>
        ${tc.steps? `<p><b>Приготовление:</b> ${escapeHtml(tc.steps)}</p>`:""}
        ${photos}

          <button class="btn btn-danger btn-sm" data-del="${tc.id}">Удалить</button>

function renderTechcards(main){
  main.appendChild(el(`<h2 class="section-title">Тех.карты</h2>`));
  if(storageMode==="local") main.appendChild(el(`<div class="banner">⚠️ Работает без общего хранилища — данные видны только в этом браузере. Смотри инструкцию по Firebase, чтобы данные были общими для всех.</div>`));

  const addGroupBtn = el(`<button class="btn btn-primary btn-sm adminOnly block" style="margin-bottom:12px;">+ Добавить группу (Бургеры, Закуски...)</button>`);
  addGroupBtn.addEventListener('click', openAddTechcardGroupModal);
  main.appendChild(addGroupBtn);

  if(DATA.techcards.length===0 && DATA.techcardGroups.length===0){
    main.appendChild(el(`<div class="empty">Пока нет технологических карт.${isAdmin? ' Нажми «+», чтобы добавить первую.':''}</div>`));
    return;
  }

  DATA.techcardGroups.forEach(g=>{
    const items = DATA.techcards.filter(tc=>tc.groupId===g.id);
    const isCollapsed = !!collapsedGroups[g.id];
    const wrap = el(`<div class="tc-group" id="tcgroup-${g.id}"></div>`);
    const head = el(`
      <div class="tc-group-head ${isCollapsed?'collapsed':''}">
        <span class="arrow">▼</span>
        <b>${escapeHtml(g.name)} <span style="opacity:.6; font-weight:400;">(${items.length})</span></b>
        <button class="btn btn-outline btn-sm adminOnly tc-group-del" data-editg="${g.id}">✏️</button>
        <button class="btn btn-danger btn-sm adminOnly tc-group-del" data-delg="${g.id}">Удалить</button>
      </div>`);
    const body = el(`<div class="tc-group-body ${isCollapsed?'collapsed':''}"></div>`);
    items.slice().reverse().forEach(tc=> body.appendChild(techcardCardEl(tc)));
    if(items.length===0) body.appendChild(el(`<div class="empty">Пусто</div>`));
    head.addEventListener('click', (e)=>{
      if(e.target.closest('[data-delg]') || e.target.closest('[data-editg]')) return;
      collapsedGroups[g.id] = !collapsedGroups[g.id];
      render();
    });
    head.querySelector('[data-editg]')?.addEventListener('click', (e)=>{
      e.stopPropagation();
      const newName = prompt("Новое название группы:", g.name);
      if(newName && newName.trim()){
        g.name = newName.trim();
        saveSection('techcardGroups').then(render);
      }
    });
    head.querySelector('[data-delg]')?.addEventListener('click', (e)=>{
      e.stopPropagation();
      if(confirm(`Удалить группу «${g.name}»? Карты внутри останутся без группы.`)){
        DATA.techcardGroups = DATA.techcardGroups.filter(x=>x.id!==g.id);
        DATA.techcards.forEach(tc=>{ if(tc.groupId===g.id) tc.groupId=null; });
        Promise.all([saveSection('techcardGroups'), saveSection('techcards')]).then(render);
      }
    });
    wrap.appendChild(head); wrap.appendChild(body);
    main.appendChild(wrap);
  });

  const ungrouped = DATA.techcards.filter(tc=>!tc.groupId || !DATA.techcardGroups.some(g=>g.id===tc.groupId));
  if(ungrouped.length){
    if(DATA.techcardGroups.length) main.appendChild(el(`<div class="subhead">Без группы</div>`));
    ungrouped.slice().reverse().forEach(tc=> main.appendChild(techcardCardEl(tc)));
  }
}

// Сжимаем фото сильно: ширина максимум 480px, качество JPEG 0.5.
// Этого достаточно чтобы разглядеть блюдо/подачу, но файл весит в разы меньше.
function resizeImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 480;
        const scale = Math.min(1, maxW/img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width*scale); canvas.height = Math.round(img.height*scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.5));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

    if(idx>=0) cat.notes[idx]=note; else cat.notes.push(note);
    await saveSection('customTabs'); closeModal(); render();
  });
}

  let out = "";
  DATA.procurement.groups.forEach(g=>{

      (sg.products||[]).forEach(p=>{
        const input = document.querySelector(`.qty[data-pid="${p.id}"]`);

/* ---------- СКАНЕР ШТРИХКОДОВ ---------- */
let scanner = null;
let scanCallback = null; // если задан — сканер работает "в режиме выбора" (например для поля штрихкода), иначе ищет цену пива сам

let nativeScanStream = null;
let nativeScanRAF = null;

async function openScanner(callback){
  scanCallback = callback || null;
  document.getElementById('scanResult').innerHTML = "";
  document.getElementById('scanOverlay').classList.remove('hidden');

  // Путь 1: нативный BarcodeDetector браузера — на современном Android/Chrome
  // (в том числе внутри Telegram) он заметно надёжнее распознаёт обычные линейные
  // штрихкоды (EAN/UPC), чем чисто JS-библиотека.
  if(window.BarcodeDetector){
    try{
      await startNativeScanner();
      return;
    }catch(err){
      console.error("Нативный сканер не сработал, пробуем запасной вариант", err);
      stopNativeScanner();
    }
  }

  // Путь 2 (запасной): библиотека html5-qrcode — без ограничивающей рамки
  // (сканируем весь кадр целиком, так надёжнее, чем в маленькое окошко),
  // с явным списком форматов и включённым experimental-флагом использовать
  // нативный детектор внутри себя, если он есть.
  if(!window.Html5Qrcode){
    document.getElementById('scanResult').innerHTML = `<div class="empty">Не удалось загрузить модуль сканера. Проверь интернет-соединение.</div>`;
    return;
  }
  const formats = window.Html5QrcodeSupportedFormats ? [
    Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8,
    Html5QrcodeSupportedFormats.UPC_A, Html5QrcodeSupportedFormats.UPC_E,
    Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.CODE_39,
    Html5QrcodeSupportedFormats.ITF, Html5QrcodeSupportedFormats.QR_CODE
  ] : undefined;
  scanner = new Html5Qrcode("reader", formats? {formatsToSupport: formats} : undefined);
  const config = {
    fps: 10,
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    // qrbox намеренно не задаём — сканируем весь кадр целиком, это надёжнее
  };
  scanner.start({facingMode:"environment"}, config, onScanSuccess).catch(err=>{
    document.getElementById('scanResult').innerHTML = `<div class="empty">Нет доступа к камере: ${escapeHtml(String(err))}</div>`;
  });
}

async function startNativeScanner(){
  const readerDiv = document.getElementById('reader');
  readerDiv.innerHTML = '<video id="nativeScanVideo" playsinline autoplay muted style="width:100%; height:100%; object-fit:cover;"></video>';
  const video = document.getElementById('nativeScanVideo');
  nativeScanStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: {ideal:"environment"}, width:{ideal:1920}, height:{ideal:1080} }
  });
  video.srcObject = nativeScanStream;
  await video.play();

  let detector;
  try{
    const supported = (await BarcodeDetector.getSupportedFormats()).filter(f=>
      ["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf","qr_code"].includes(f));
    detector = new BarcodeDetector({ formats: supported.length? supported : undefined });
  }catch(e){ detector = new BarcodeDetector(); }

  let stopped = false;
  async function tick(){
    if(stopped) return;
    try{
      const codes = await detector.detect(video);
      if(codes && codes.length){
        onScanSuccess(codes[0].rawValue);
        if(scanCallback){ stopped = true; return; } // в режиме выбора значения (штрихкод для пива) — одного скана достаточно
      }
    }catch(e){ /* игнорируем единичные сбои кадра, пробуем дальше */ }
    nativeScanRAF = requestAnimationFrame(tick);
  }
  tick();
  // сохраняем способ остановки для closeScanner()
  scanner = { isNative:true, stop: async ()=>{ stopped=true; if(nativeScanRAF) cancelAnimationFrame(nativeScanRAF); }, clear: ()=>{} };
}

function stopNativeScanner(){
  if(nativeScanRAF){ cancelAnimationFrame(nativeScanRAF); nativeScanRAF = null; }
  if(nativeScanStream){ nativeScanStream.getTracks().forEach(t=>t.stop()); nativeScanStream = null; }
}

function onScanSuccess(decodedText){
  if(scanCallback){
    scanCallback(decodedText);
    closeScanner();
    return;
  }
  const found = DATA.beer.find(b=> b.barcode && b.barcode === decodedText);
  const resultBox = document.getElementById('scanResult');
  if(found){
    resultBox.innerHTML = `<div class="card"><h3>${escapeHtml(found.name)}</h3><div class="beer-price">${found.price!=null && found.price!==''? found.price+" ₽":"цена не указана"}</div></div>`;
  } else {
    resultBox.innerHTML = `<div class="empty">Штрихкод «${escapeHtml(decodedText)}» не найден в списке пива.</div>`;
  }
}

function closeScanner(){
  document.getElementById('scanOverlay').classList.add('hidden');
  scanCallback = null;
  stopNativeScanner();
  if(scanner){
    scanner.stop().then(()=>scanner.clear()).catch(()=>{});
    scanner = null;
  }
}

/* ---------- БРОНИ (таблица, опционально синхронизируется с Google Таблицей) ---------- */
const RESERVATION_COLS = [
  {key:"date", label:"Дата"},
  {key:"time", label:"Время"},
  {key:"name", label:"Имя"},
  {key:"phone", label:"Телефон"},
  {key:"count", label:"Кол-во"},
  {key:"deposit", label:"Депозит"},
  {key:"table", label:"Стол"}
];

function reservationsSheetConfigured(){ return !!GOOGLE_SHEETS_WEBAPP_URL; }
let reservationsSyncError = null; // текст последней ошибки синхронизации, чтобы показать в интерфейсе, а не только в консоли

// Подтягиваем актуальные брони прямо из Google Таблицы (значит, правки, внесённые
// вручную в самой таблице, тоже подхватятся). Если таблица не подключена — просто выходим,
// работаем с тем, что сохранено локально/в общем хранилище приложения.
async function fetchReservationsFromSheet(){
  if(!reservationsSheetConfigured()) return;
  try{
    const res = await fetch(GOOGLE_SHEETS_WEBAPP_URL, {method:"GET"});
    const text = await res.text();
    let rows;
    try{ rows = JSON.parse(text); }
    catch(parseErr){
      // Пришёл не JSON — почти всегда это HTML-страница входа в Google
      // (значит "Who has access" при развёртывании выставлен не на "Все"),
      // либо ссылка развёртывания устарела после правки кода скрипта.
      throw new Error("Таблица вернула не список броней, а страницу входа/ошибки. Проверь настройки доступа веб-приложения в Apps Script (должно быть \"Все\") и что ты пересоздал развёртывание после последней правки кода.");
    }
    if(!Array.isArray(rows)) throw new Error("Таблица вернула неожиданный формат данных.");
    DATA.reservations = rows.map(row=>({
      id: "row-"+row.row, row: row.row,
      date: row.date||"", time: row.time||"", name: row.name||"",
      phone: row.phone||"", count: row.count||"", deposit: row.deposit||"", table: row.table||""
    }));
    await saveSection('reservations'); // локальный кэш на случай, если таблица временно недоступна
    reservationsSyncError = null;
  }catch(e){
    console.error("Не удалось получить брони из Google Таблицы", e);
    reservationsSyncError = e.message || String(e);
  }
}

// Отправляем изменение в Google Таблицу. action: 'add' | 'update' | 'delete'.
// mode:'no-cors' — не можем прочитать ответ сразу, поэтому после отправки перезапрашиваем список.
async function pushReservationToSheet(action, r){
  if(!reservationsSheetConfigured()) return;
  await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({action, row:r.row, date:r.date, time:r.time, name:r.name, phone:r.phone, count:r.count, deposit:r.deposit, table:r.table})
  }).catch(()=>{ /* тихо игнорируем сетевые ошибки — юзер увидит, что бронь не обновилась, и попробует ещё раз */ });
}

function renderReservations(main){
  main.appendChild(el(`<h2 class="section-title">Брони</h2>`));
  if(!reservationsSheetConfigured()){
    main.appendChild(el(`<div class="banner">⚠️ Синхронизация с Google Таблицей не настроена — брони сохраняются только внутри приложения.</div>`));
  } else if(reservationsSyncError){
    main.appendChild(el(`<div class="banner" style="border-color:var(--danger); color:var(--danger);">⚠️ Не удалось обновить из таблицы: ${escapeHtml(reservationsSyncError)}</div>`));
  } else {
    main.appendChild(el(`<div class="banner">✅ Синхронизировано с Google Таблицей — правки в самой таблице тоже подхватятся при следующем открытии.</div>`));
  }

  const btnRow = el(`<div style="display:flex; gap:8px; margin-bottom:12px;"></div>`);
  const addBtn = el(`<button class="btn btn-primary btn-sm" style="flex:1;">+ Добавить бронь</button>`);
  addBtn.addEventListener('click', ()=> openReservationModal(null));
  btnRow.appendChild(addBtn);
  if(reservationsSheetConfigured()){
    const refreshBtn = el(`<button class="btn btn-outline btn-sm">🔄 Обновить</button>`);
    refreshBtn.addEventListener('click', async ()=>{ await fetchReservationsFromSheet(); render(); });
    btnRow.appendChild(refreshBtn);
  }
  main.appendChild(btnRow);

  if(DATA.reservations.length===0){
    main.appendChild(el(`<div class="empty">Пока нет броней.</div>`));
  } else {
    const tableWrap = el(`<div style="overflow-x:auto;"></div>`);
    const table = el(`<table style="width:100%; border-collapse:collapse; font-size:12.5px;"></table>`);
    const thead = el(`<thead><tr>${RESERVATION_COLS.map(c=>`<th style="text-align:left; padding:7px 8px; border-bottom:1.5px solid var(--card-border); color:var(--accent); white-space:nowrap;">${c.label}</th>`).join("")}<th style="padding:7px 8px; border-bottom:1.5px solid var(--card-border);"></th></tr></thead>`);
    table.appendChild(thead);
    const tbody = el(`<tbody></tbody>`);
    DATA.reservations.slice().reverse().forEach(r=>{
      const tr = el(`<tr>${RESERVATION_COLS.map(c=>`<td style="padding:7px 8px; border-bottom:1px solid var(--card-border); white-space:nowrap;">${escapeHtml(String(r[c.key]||""))}</td>`).join("")}<td style="padding:7px 8px; border-bottom:1px solid var(--card-border); white-space:nowrap;">
        <button class="btn btn-outline btn-sm" data-edit="${r.id}">✏️</button>
        <button class="btn btn-danger btn-sm" data-del="${r.id}">✕</button>
      </td></tr>`);
      tr.querySelector('[data-edit]')?.addEventListener('click', ()=> openReservationModal(r));
      tr.querySelector('[data-del]')?.addEventListener('click', ()=> deleteReservation(r));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.appendChild(table);
    main.appendChild(tableWrap);
  }
}

async function deleteReservation(r){
  if(!confirm("Удалить бронь?")) return;
  if(reservationsSheetConfigured()){
    await pushReservationToSheet('delete', r);
    await fetchReservationsFromSheet();
    render();
  } else {
    DATA.reservations = DATA.reservations.filter(x=>x.id!==r.id);
    await saveSection('reservations'); render();
  }
}

function openReservationModal(r){
  const editing = !!r;
  r = r || {id:uid(), row:null, date:"", time:"", name:"", phone:"", count:"", deposit:"", table:""};
  const body = `
    <h3>${editing? "Изменить бронь":"Новая бронь"}</h3>
    <div class="field"><label>Дата</label><input type="text" id="f_date" value="${attr(r.date)}" placeholder="напр. 25.08"></div>
    <div class="field"><label>Время</label><input type="text" id="f_time" value="${attr(r.time)}" placeholder="напр. 19:00"></div>
    <div class="field"><label>Имя</label><input type="text" id="f_name" value="${attr(r.name)}"></div>
    <div class="field"><label>Телефон</label><input type="text" id="f_phone" value="${attr(r.phone)}"></div>
    <div class="field"><label>Кол-во человек</label><input type="number" min="1" id="f_count" value="${attr(String(r.count??''))}"></div>
    <div class="field"><label>Депозит</label><input type="text" id="f_deposit" value="${attr(r.deposit)}"></div>
    <div class="field"><label>Стол</label><input type="text" id="f_table" value="${attr(r.table)}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" id="mCancel">Отмена</button>
      <button class="btn btn-primary" id="mSave">Сохранить</button>
    </div>`;
  const overlay = openModal(body);
  overlay.querySelector('#mCancel').addEventListener('click', closeModal);
  overlay.querySelector('#mSave').addEventListener('click', async ()=>{
    const name = overlay.querySelector('#f_name').value.trim();
    if(!name){ alert("Укажи имя"); return; }
    r.date = overlay.querySelector('#f_date').value.trim();
    r.time = overlay.querySelector('#f_time').value.trim();
    r.name = name;
    r.phone = overlay.querySelector('#f_phone').value.trim();
    r.count = overlay.querySelector('#f_count').value.trim();
    r.deposit = overlay.querySelector('#f_deposit').value.trim();
    r.table = overlay.querySelector('#f_table').value.trim();
    closeModal();
    if(reservationsSheetConfigured()){
      await pushReservationToSheet(editing? 'update':'add', r);
      await fetchReservationsFromSheet();
      render();
    } else {
      upsert('reservations', r);
      await saveSection('reservations'); render();
    }
  });
}

/* ==================== ОБЩИЕ ХЕЛПЕРЫ ==================== */
function upsert(section, item){
  const arr = DATA[section];
  const idx = arr.findIndex(x=>x.id===item.id);
  if(idx>=0) arr[idx]=item; else arr.push(item);
}
async function deleteItem(section, id){
  if(!confirm("Удалить запись?")) return;
  DATA[section] = DATA[section].filter(x=>x.id!==id);
  await saveSection(section); render();
}
function openAddModalForTab(){
  if(activeTab==="techcards") openTechcardModal(null);
}
function openModal(innerHtml){
  const overlay = el(`<div id="modalOverlay"><div id="modal">${innerHtml}</div></div>`);
  overlay.addEventListener('click', (e)=>{ if(e.target.id==='modalOverlay') closeModal(); });
  document.body.appendChild(overlay);
  return overlay;
}
function closeModal(){ document.getElementById('modalOverlay')?.remove(); }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function attr(s){ return escapeHtml(s); }

/* ==================== СТАРТ ==================== */
(async function start(){
  applyTheme();
  initTelegram();
  initStorage();
  await loadAllData();
  subscribeRealtime();
  applyAdminState(); // покажет "админ" и карандаш редактирования сразу, если ID в списке ADMIN_IDS
})();
</script>
